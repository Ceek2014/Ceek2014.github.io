/* 题型清单：ready=false 的题型预留入口，题库上传后改为 true 并在 BANK 中补充数据即可 */
const TYPES = [
  /* v2 修改：原"诗歌鉴赏"更名为"诗歌阅读" */
  { name: "诗歌阅读", ready: true },
  /* v2 新增模块 / v3 填充 / v4 扩充 / v5 调整：诗歌诵读 120 题，全部为情境默写 */
  { name: "诗歌诵读", ready: true },
  /* v6 新增题库：文言文阅读 7 篇，题型覆盖通假字、特殊句式、词类活用、古今异义、实词、翻译、问答与文学常识 */
  { name: "文言文阅读", ready: true },
  /* v9 新增 / v11 扩充 / v12 扩充：作文写作 73 条（含一元、二元作文材料各 10 则） */
  { name: "作文写作", ready: true },
  /* v15 新增题库：应用文写作 6 种文种各 10 题，共 60 题（依据 2027 考纲：格式规范+职场情境） */
  { name: "应用文写作", ready: true }
];

/* ========================= v7 新增：题目形式分类 ========================= */
/* 依据题干固定前缀自动归类，题库原始 q / a 一字不改 */
const FORM_ORDER = ["通假字", "特殊句式", "词类活用", "古今异义", "实词解释", "句子翻译", "问答题与文学常识"];
/* v9 新增 / v14 修改：作文写作的"背诵内容"仅保留三类，原 8 类题目形式不再作为筛选项 */
const WRITING_FORMS = ["万能素材句模板", "一元作文材料", "二元作文材料"];
function getFormOrder() {
  return currentType === "作文写作" ? WRITING_FORMS : FORM_ORDER;
}
function classifyForm(q) {
  if (/通哪个字|同哪个字/.test(q)) return "通假字";
  if (/指出下列句子的句式特点/.test(q)) return "特殊句式";
  if (/加点词的活用/.test(q)) return "词类活用";
  if (/古义和今义/.test(q)) return "古今异义";
  if (/^解释.*加点词/.test(q)) return "实词解释";
  if (/^翻译句子/.test(q)) return "句子翻译";
  return "问答题与文学常识";
}
/* 为文言文阅读 415 题标注 form 字段 */
Object.values(BANK["文言文阅读"]).forEach(list => list.forEach(item => {
  item.form = classifyForm(item.q);
}));

/* ========================= 状态与工具 ========================= */
let currentType = "诗歌阅读";
const selectedPoems = new Set();
const selectedForms = new Set(); /* v7 新增：已选题目形式 */
const formQty = {}; /* v14 新增：文言文各题目形式分别设置的数量 { 形式名: 数量 } */

const $ = (id) => document.getElementById(id);

/* v6 新增：题干与答案支持 **加粗** 与 ++着重号++ 标记 */
function fmt(text) {
  return String(text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\+\+(.+?)\+\+/g, '<span class="emphasis">$1</span>');
}

function getPoems() {
  return Object.keys(BANK[currentType] || {});
}
/* v14 改造：抽题池生成。文言文按各形式数量分别取题；小作文按"背诵内容"三类筛选；其余沿用篇目+形式筛选 */
function getAllQuestions(selectedOnly) {
  const isClassical = currentType === "文言文阅读";
  const isWriting = currentType === "作文写作";
  /* 文言文/小作文忽略篇目勾选（文言文仍按篇目过滤，小作文篇目区已隐藏） */
  const poems = getPoems().filter(p => (isWriting || !selectedOnly) || selectedPoems.has(p));
  const list = [];
  poems.forEach(p => {
    BANK[currentType][p].forEach((item, idx) => {
      if (isClassical) {
        /* 文言文：仅取"填了数量"的形式，且按各自数量抽取 */
        const qty = formQty[item.form] || 0;
        if (qty <= 0) return;
        list.push({ poem: p, index: idx + 1, ...item, _qty: qty });
      } else {
        /* 小作文/其他：按是否已选题目形式筛选 */
        const useForm = (isWriting) && selectedForms.size > 0;
        if (useForm && !selectedForms.has(item.form)) return;
        list.push({ poem: p, index: idx + 1, ...item });
      }
    });
  });
  return list;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ========================= 初始化渲染 ========================= */
function renderTypes() {
  $("typeTabs").innerHTML = TYPES.map(t =>
    `<button class="type-tab ${t.ready ? (t.name === currentType ? 'active' : '') : 'disabled'}"
       ${t.ready ? `data-type="${t.name}"` : 'disabled'}>${t.name}</button>`
  ).join("");
  document.querySelectorAll(".type-tab[data-type]").forEach(btn => {
    btn.addEventListener("click", () => {
      currentType = btn.dataset.type;
      selectedPoems.clear();
      selectedForms.clear(); /* v7 新增：切换题型时清空形式筛选 */
      Object.keys(formQty).forEach(k => delete formQty[k]); /* v14 新增：切换题型时清空各形式数量 */
      renderTypes();
      renderPoems();
      renderForms(); /* v7 新增 */
      syncRange();
      updateSectionVisibility(); /* v14 新增：按题型显示/隐藏区块 */
      $("errMsg").textContent = "";
      clearResult();
    });
  });
}

/* v14 新增：按题型控制区块显示。作文写作删除"背诵内容"篇目区（其内容已并入题目形式区并改名"背诵内容"） */
function updateSectionVisibility() {
  const isWriting = currentType === "作文写作";
  $("poemSection").style.display = isWriting ? "none" : "";
  $("countSectionTitle").textContent = "题目数量";
}

function renderPoems() {
  const poems = getPoems();
  if (poems.length === 0) {
    $("poemGrid").innerHTML = `<div class="poem-empty">「${currentType}」题库内容待上传，暂不可抽题</div>`;
    return;
  }
  $("poemGrid").innerHTML = poems.map(p =>
    `<label class="poem-item">
       <input type="checkbox" value="${p}">
       <span class="poem-name">${p}</span>
       <span class="poem-count">${BANK[currentType][p].length}题</span>
     </label>`
  ).join("");
  document.querySelectorAll("#poemGrid input").forEach(cb => {
    cb.addEventListener("change", () => {
      cb.checked ? selectedPoems.add(cb.value) : selectedPoems.delete(cb.value);
      cb.parentElement.classList.toggle("checked", cb.checked);
      renderForms(); /* v8 新增：形式列表随背诵内容变化 */
      syncRange();
      $("errMsg").textContent = "";
    });
  });
}

/* v7 新增 / v8 修改 / v9 扩展 / v14 大改：题目形式（文言文）/ 背诵内容（小作文）界面
   - 文言文阅读：每个题目形式旁增加数量输入，按各形式分别抽题
   - 作文写作：删除篇目区，本区标题改为"背诵内容"，仅显示三类
   列表与题数随已选篇目动态生成 */
function renderForms() {
  const section = $("formSection");
  const isWriting = currentType === "作文写作";
  const isClassical = currentType === "文言文阅读";
  if (!isClassical && !isWriting) {
    section.style.display = "none";
    return;
  }
  section.style.display = "";
  /* v14 新增：作文写作把本区标题改为"背诵内容"，文言文保持"题目形式" */
  $("formSectionTitle").textContent = isWriting ? "背诵内容" : "题目形式";
  /* v14 新增：按已选篇目统计（未选篇目则按全部篇目）。小作文忽略篇目选择（篇目区已隐藏） */
  const hasSelection = isClassical && selectedPoems.size > 0;
  const poems = getPoems().filter(p => !hasSelection || selectedPoems.has(p));
  const counts = {};
  poems.forEach(p => BANK[currentType][p].forEach(it => {
    counts[it.form] = (counts[it.form] || 0) + 1;
  }));
  /* 剔除所选篇目中不存在的形式，避免残留筛选导致抽不出题 */
  [...selectedForms].forEach(f => { if (!counts[f]) selectedForms.delete(f); });
  if (isWriting) {
    $("formTip").textContent = "（可多选，不选则默认全部内容）";
  } else {
    $("formTip").textContent = hasSelection
      ? `（根据已选 ${poems.length} 篇生成，勾选后在右侧填数量）`
      : "（根据全部篇目生成，勾选后在右侧填数量）";
  }
  /* 按题型取形式顺序；暂无内容的类别显示"待补充"且不可勾选 */
  $("formGrid").innerHTML = getFormOrder().map(f => {
    const n = counts[f] || 0;
    if (n === 0) {
      return `<label class="form-chip" style="opacity:.5;cursor:not-allowed;" title="题库内容待补充">
         <input type="checkbox" value="${f}" disabled>
         <span>${f}</span>
         <span class="form-count">待补充</span>
       </label>`;
    }
    const on = selectedForms.has(f);
    /* v14 新增：文言文每个形式带数量输入框（默认 1，上限为该形式题数）；首次渲染写入 formQty 默认值 */
    let qtyBox = "";
    if (isClassical) {
      if (formQty[f] === undefined) formQty[f] = on ? 1 : 0;
      const val = Math.min(formQty[f], n); /* 题数变化时收敛上限 */
      formQty[f] = val;
      qtyBox = `<span class="form-qty"><input type="number" class="form-qty-input" data-form="${f}" min="0" max="${n}" value="${val}" title="抽取数量"></span>`;
    }
    return `<label class="form-chip ${on ? "checked" : ""}" data-form="${f}">
       <input type="checkbox" value="${f}" ${on ? "checked" : ""}>
       <span>${f}</span>
       <span class="form-count">${n}题</span>
       ${qtyBox}
     </label>`;
  }).join("");
  /* 复选框：切换是否参与抽题 */
  document.querySelectorAll("#formGrid input[type=checkbox]:not([disabled])").forEach(cb => {
    cb.addEventListener("change", () => {
      const f = cb.value;
      cb.checked ? selectedForms.add(f) : selectedForms.delete(f);
      cb.parentElement.classList.toggle("checked", cb.checked);
      if (isClassical) {
        /* v14 新增：文言文勾选/取消时同步数量，保证与抽题逻辑一致 */
        const qtyInput = cb.parentElement.querySelector(".form-qty-input");
        if (cb.checked && (formQty[f] || 0) <= 0) { formQty[f] = 1; if (qtyInput) qtyInput.value = 1; }
        if (!cb.checked) { formQty[f] = 0; if (qtyInput) qtyInput.value = 0; }
      }
      syncRange();
      $("errMsg").textContent = "";
    });
  });
  /* v14 新增：文言文数量输入——填写数量即自动勾选该形式，清空/0 则取消勾选 */
  document.querySelectorAll("#formGrid .form-qty-input").forEach(inp => {
    inp.addEventListener("click", (e) => e.stopPropagation()); /* 避免点到输入框触发 label 的 checkbox */
    inp.addEventListener("input", () => {
      const f = inp.dataset.form;
      let v = parseInt(inp.value, 10);
      if (!Number.isInteger(v) || v < 0) v = 0;
      const max = parseInt(inp.max, 10) || 0;
      if (v > max) v = max;
      formQty[f] = v;
      const cb = inp.parentElement.parentElement.querySelector('input[type=checkbox]');
      if (v > 0) { selectedForms.add(f); cb.checked = true; inp.parentElement.parentElement.classList.add("checked"); }
      else { selectedForms.delete(f); cb.checked = false; inp.parentElement.parentElement.classList.remove("checked"); }
      syncRange();
      $("errMsg").textContent = "";
    });
  });
}
function setAllForms(checked) {
  document.querySelectorAll("#formGrid input[type=checkbox]:not([disabled])").forEach(cb => { /* v14 修改：仅 checkbox，跳过"待补充"与数量输入 */
    cb.checked = checked;
    cb.parentElement.classList.toggle("checked", checked);
    checked ? selectedForms.add(cb.value) : selectedForms.delete(cb.value);
    /* v14 新增：文言文全选时同步把该形式数量补为 1（若原为0），清空时数量归零 */
    if (currentType === "文言文阅读") {
      const qtyInput = cb.parentElement.querySelector(".form-qty-input");
      if (qtyInput) {
        if (checked && (formQty[cb.value] || 0) <= 0) { formQty[cb.value] = 1; qtyInput.value = 1; }
        if (!checked) { formQty[cb.value] = 0; qtyInput.value = 0; }
      }
    }
  });
  syncRange();
}

function setAllPoems(checked) {
  document.querySelectorAll("#poemGrid input").forEach(cb => {
    cb.checked = checked;
    cb.parentElement.classList.toggle("checked", checked);
    checked ? selectedPoems.add(cb.value) : selectedPoems.delete(cb.value);
  });
  renderForms(); /* v8 新增：全选/清空篇目时同步刷新形式列表 */
  syncRange();
}

/* v14 改造：数量上限。文言文=各形式填写数量之和（受篇目题数约束后），其余=题库总数 */
function currentMax() {
  if (currentType === "文言文阅读") {
    const hasSelection = selectedPoems.size > 0;
    /* 按形式累加各形式数量（受该形式可用题数约束），而非按题累加 */
    return FORM_ORDER.reduce((sum, f) => {
      const qty = formQty[f] || 0;
      if (qty <= 0) return sum;
      return sum + Math.min(qty, countFormAvailable(f, hasSelection));
    }, 0);
  }
  const hasSelection = selectedPoems.size > 0;
  return getAllQuestions(hasSelection).length;
}
/* v14 新增：某形式在当前篇目下的可用题数 */
function countFormAvailable(form, hasSelection) {
  const poems = getPoems().filter(p => !hasSelection || selectedPoems.has(p));
  let n = 0;
  poems.forEach(p => BANK[currentType][p].forEach(it => { if (it.form === form) n++; }));
  return n;
}
function syncRange() {
  /* v14 新增：文言文按各形式分别设数量，隐藏全局题目数量区 */
  if (currentType === "文言文阅读") {
    $("countSection").style.display = "none";
    const max = currentMax();
    if (max === 0) {
      $("drawBtn").disabled = true;
      $("formTip").textContent = "（请勾选题目形式并在右侧填写数量）";
    } else {
      $("drawBtn").disabled = false;
      const hasSelection = selectedPoems.size > 0;
      $("formTip").textContent = (hasSelection ? `（已选 ${selectedPoems.size} 篇，` : "（全部篇目，")
        + `已设 ${[...selectedForms].filter(f => (formQty[f]||0) > 0).length} 种形式，共 ${max} 题）`;
    }
    return;
  }
  $("countSection").style.display = "";
  const max = currentMax();
  const effectiveMax = max || getAllQuestions(false).length;
  if (effectiveMax === 0) {
    $("rangeText").textContent = "题库待上传";
    $("countInput").max = 1;
    $("drawBtn").disabled = true;
    return;
  }
  $("drawBtn").disabled = false;
  $("rangeText").textContent = `1 – ${effectiveMax}`;
  $("countInput").max = effectiveMax;
}

/* ========================= 抽题与展示 ========================= */
function draw() {
  $("errMsg").textContent = "";
  const hasSelection = selectedPoems.size > 0;
  const selfTest = $("selfTestMode").checked; /* v10 新增：自测模式决定内容是否默认展开 */
  const isClassical = currentType === "文言文阅读";

  let picked, pickedCount;
  if (isClassical) {
    /* v14 新增：文言文按各题目形式分别随机抽取指定数量 */
    const forms = FORM_ORDER.filter(f => (formQty[f] || 0) > 0);
    if (forms.length === 0) {
      $("errMsg").textContent = "请先勾选题目形式并在右侧填写抽取数量";
      return;
    }
    picked = [];
    forms.forEach(f => {
      const poems = getPoems().filter(p => !hasSelection || selectedPoems.has(p));
      const candidates = [];
      poems.forEach(p => BANK[currentType][p].forEach((it, idx) => {
        if (it.form === f) candidates.push({ poem: p, index: idx + 1, ...it });
      }));
      const want = Math.min(formQty[f], candidates.length);
      picked.push(...shuffle(candidates).slice(0, want));
    });
    if (picked.length === 0) {
      $("errMsg").textContent = "当前筛选条件下没有题目，请调整篇目或形式数量";
      return;
    }
    pickedCount = picked.length;
  } else {
    const pool = getAllQuestions(hasSelection);
    const max = pool.length;
    const n = parseInt($("countInput").value, 10);
    if (max === 0) {
      $("errMsg").textContent = getPoems().length === 0
        ? `「${currentType}」题库暂未上传，请先补充内容`
        : "当前筛选条件下没有题目，请调整篇目或题目形式";
      return;
    }
    if (!Number.isInteger(n) || n < 1) {
      $("errMsg").textContent = "请输入不小于 1 的题目数量";
      return;
    }
    if (n > max) {
      $("errMsg").textContent = `当前范围最多可抽 ${max} 题，请调小数量`;
      return;
    }
    picked = shuffle(pool).slice(0, n);
    pickedCount = n;
  }
  const n = pickedCount;
  $("resultHead").style.display = "flex";
  /* v7 新增 / v14 修改：结果摘要。文言文显示各形式数量明细，小作文显示背诵内容 */
  const formDesc = isClassical
    ? ` · 形式：${FORM_ORDER.filter(f => (formQty[f] || 0) > 0).map(f => `${f}×${formQty[f]}`).join("、")}`
    : (currentType === "作文写作" && selectedForms.size)
      ? ` · 背诵内容：${WRITING_FORMS.filter(f => selectedForms.has(f)).join("、")}` : "";
  $("resultSub").textContent = `共 ${n} 张背诵卡 · 来源：${hasSelection ? [...selectedPoems].join("、") : "全部篇目"}${formDesc}`; /* v10 修改 */

  $("questionList").innerHTML = picked.map((item, i) => {
    const isBook = item.q.startsWith("【书后习题】"); /* v7 新增：下方模板增加题目形式标签 */
    /* v13 新增：作文材料题——题干为完整材料（正文显示），答案为提取的关键词 */
    const isMaterial = item.form === "一元作文材料" || item.form === "二元作文材料";
    return `
      <div class="question-card">
        <div class="q-meta">
          <span class="q-no">第 ${i + 1} 张</span>
          <span class="q-tag">${item.poem}</span>
          ${item.form ? `<span class="q-tag">${fmt(item.form)}</span>` : ''}
          ${isBook ? '<span class="q-tag book">书后习题</span>' : ''}
        </div>
        ${isMaterial
          ? `<div class="q-text material-text">${fmt(item.q)}</div>`
          : `<div class="q-text recite-hint">${fmt(item.q)}</div>`}
        <button class="answer-toggle" data-label="${isMaterial ? "关键词" : "内容"}">${selfTest ? "显示" + (isMaterial ? "关键词" : "内容") : "隐藏" + (isMaterial ? "关键词" : "内容")}</button>
        <div class="answer-box recite ${selfTest ? "" : "show"}"><span class="answer-label">${isMaterial ? "关键词：" : "背诵内容："}</span>${fmt(item.a)}</div>
      </div>`;
  }).join("");

  document.querySelectorAll(".answer-toggle").forEach(btn => {
    btn.addEventListener("click", () => {
      const box = btn.nextElementSibling;
      const show = box.classList.toggle("show");
      btn.textContent = show ? "隐藏" + btn.dataset.label : "显示" + btn.dataset.label; /* v10 修改 / v13 按卡片类型显示文案 */
    });
  });
}

/* ========================= 事件绑定 ========================= */
$("selectAll").addEventListener("click", () => setAllPoems(true));
$("clearAll").addEventListener("click", () => setAllPoems(false));
/* v7 新增：题目形式全选 / 清空 */
$("selectAllForms").addEventListener("click", () => setAllForms(true));
$("clearAllForms").addEventListener("click", () => setAllForms(false));
$("drawBtn").addEventListener("click", draw);
$("countInput").addEventListener("keydown", (e) => { if (e.key === "Enter") draw(); });
/* v2 新增：清空抽题结果，供切换题型与重置条件共用 */
function clearResult() {
  $("resultHead").style.display = "none";
  $("questionList").innerHTML = `<div class="empty"><span class="icon">✦</span>设置好条件后点击"抽题"，背诵卡片将在这里显示</div>`; /* v10 修改 */
}
$("resetBtn").addEventListener("click", () => {
  setAllPoems(false);
  setAllForms(false); /* v7 新增：重置时清空形式筛选 */
  $("countInput").value = 5;
  $("errMsg").textContent = "";
  clearResult();
});
$("expandAll").addEventListener("click", () => {
  document.querySelectorAll(".answer-box").forEach(b => b.classList.add("show"));
  document.querySelectorAll(".answer-toggle").forEach(b => b.textContent = "隐藏" + b.dataset.label); /* v13 按卡片类型显示文案 */
});
$("collapseAll").addEventListener("click", () => {
  document.querySelectorAll(".answer-box").forEach(b => b.classList.remove("show"));
  document.querySelectorAll(".answer-toggle").forEach(b => b.textContent = "显示" + b.dataset.label); /* v13 按卡片类型显示文案 */
});
/* v10 新增：自测模式开关，一键切换所有背诵内容的显示状态 */
$("selfTestMode").addEventListener("change", (e) => {
  const hide = e.target.checked;
  document.querySelectorAll(".answer-box").forEach(b => b.classList.toggle("show", !hide));
  document.querySelectorAll(".answer-toggle").forEach(b => b.textContent = (hide ? "显示" : "隐藏") + b.dataset.label); /* v13 按卡片类型显示文案 */
});

/* 启动 */
renderTypes();
renderPoems();
renderForms(); /* v7 新增 */
syncRange();
updateSectionVisibility(); /* v14 新增：启动时的区块可见性 */
</script>
</body>
</html>
