<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语文抽背系统</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-light: #eff6ff;
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2937;
    --text-sub: #6b7280;
    --border: #e5e7eb;
    --answer-bg: #fffbeb;
    --answer-border: #fcd34d;
    --shadow: 0 2px 12px rgba(31, 41, 55, 0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.75;
    padding-bottom: 60px;
  }

  /* ========== 顶部横幅（图片由 img 承载，避免 CSS 超长 base64） ========== */
  .hero { position: relative; overflow: hidden; color: #fff; padding: 52px 20px 46px; text-align: center; background: #1e3a8a; }
  .hero-bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  .hero-overlay { position:absolute; inset:0; z-index:1; background:linear-gradient(180deg,rgba(9,30,66,.62),rgba(9,30,66,.40) 55%,rgba(9,30,66,.58)); }
  .hero-inner { position:relative; z-index:2; }
  .hero h1 { font-size: 34px; letter-spacing: 6px; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,.55); }
  .hero p { margin-top: 10px; font-size: 15px; opacity: .92; letter-spacing: 2px; text-shadow: 0 1px 6px rgba(0,0,0,.5); }

  .container { max-width: 960px; margin: 0 auto; padding: 0 20px; }

  /* ========== 配置面板 ========== */
  .panel {
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 26px 28px;
    margin-top: -14px;
    position: relative;
    z-index: 1;
  }
  .section { margin-bottom: 24px; }
  .section:last-of-type { margin-bottom: 18px; }
  .section-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::before {
    content: "";
    width: 4px;
    height: 16px;
    border-radius: 2px;
    background: var(--primary);
  }
  .tip { font-size: 12px; color: var(--text-sub); font-weight: 400; margin-left: 4px; }

  /* 题型按钮 */
  .type-tabs { display: flex; flex-wrap: wrap; gap: 10px; }
  .type-tab {
    padding: 9px 20px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
  }
  .type-tab:hover:not(.disabled) { border-color: var(--primary); color: var(--primary); }
  .type-tab.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .type-tab.disabled { background: #f9fafb; color: #b0b7c3; cursor: not-allowed; }
  .type-tab.disabled::after { content: " · 待更新"; font-size: 11px; }

  /* 篇目复选 */
  .toolbar-row { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  .link-btn {
    background: none; border: none; color: var(--primary); cursor: pointer;
    font-size: 13px; font-family: inherit; padding: 0;
  }
  .link-btn:hover { text-decoration: underline; }
  .poem-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 10px;
  }
  .poem-item {
    display: flex; align-items: center; gap: 9px;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: all .18s;
    user-select: none;
  }
  .poem-item:hover { border-color: #93c5fd; background: var(--primary-light); }
  .poem-item.checked { border-color: var(--primary); background: var(--primary-light); }
  .poem-item input { accent-color: var(--primary); width: 15px; height: 15px; cursor: pointer; }
  .poem-name { flex: 1; }
  .poem-count { font-size: 12px; color: var(--text-sub); }

  /* v7 新增：题目形式筛选 */
  .form-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .form-chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 15px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: #fff;
    cursor: pointer;
    font-size: 14px;
    transition: all .18s;
    user-select: none;
  }
  .form-chip:hover { border-color: #93c5fd; background: var(--primary-light); }
  .form-chip.checked { border-color: var(--primary); background: var(--primary); color: #fff; }
  .form-chip input { accent-color: var(--primary); width: 14px; height: 14px; cursor: pointer; }
  .form-chip .form-count { font-size: 12px; opacity: .72; }
  /* v14 新增：文言文各题目形式旁的数量输入 */
  .form-qty { display: inline-flex; align-items: center; gap: 4px; margin-left: 2px; }
  .form-qty input[type="number"] {
    width: 52px; padding: 3px 6px; text-align: center;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; font-family: inherit; color: var(--text); background: #fff;
  }
  .form-qty input[type="number"]:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-light); }
  .form-chip.checked .form-qty input[type="number"] { background: #fff; color: #14532d; }

  /* 数量输入 */
  .count-row { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
  .count-row input[type="number"] {
    width: 100px; padding: 9px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 15px; font-family: inherit; color: var(--text);
  }
  .count-row input[type="number"]:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
  .range-hint { font-size: 13px; color: var(--text-sub); }
  .range-hint b { color: var(--primary); }

  /* 抽题按钮 */
  .action-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
  .btn-primary {
    background: var(--primary); color: #fff; border: none;
    padding: 12px 40px; border-radius: 9px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: all .2s;
    box-shadow: 0 4px 12px rgba(37, 99, 235, .25);
  }
  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
  .btn-ghost {
    background: #fff; color: var(--text-sub); border: 1px solid var(--border);
    padding: 10px 18px; border-radius: 9px;
    font-size: 14px; cursor: pointer; font-family: inherit; transition: all .2s;
  }
  .btn-ghost:hover { color: var(--primary); border-color: var(--primary); }
  .err-msg { color: #dc2626; font-size: 13px; min-height: 20px; }

  /* ========== 题目区 ========== */
  .result-head {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px; margin: 30px 2px 14px;
  }
  .result-head h2 { font-size: 19px; }
  .result-head .sub { font-size: 13px; color: var(--text-sub); font-weight: 400; margin-left: 8px; }

  .question-card {
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 20px 24px;
    margin-bottom: 14px;
    border-left: 4px solid var(--primary);
  }
  .q-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .q-no { font-size: 14px; font-weight: 700; color: var(--primary); }
  .q-tag {
    font-size: 12px; color: var(--primary-dark);
    background: var(--primary-light); border-radius: 20px; padding: 2px 11px;
  }
  .q-tag.book {
    color: #b45309; background: #fef3c7;
  }
  .q-text { font-size: 15.5px; line-height: 1.85; white-space: pre-line; }

  .answer-toggle {
    margin-top: 12px;
    background: #fff; color: var(--primary);
    border: 1px solid #bfdbfe; border-radius: 7px;
    padding: 6px 16px; font-size: 13px; cursor: pointer;
    font-family: inherit; transition: all .2s;
  }
  .answer-toggle:hover { background: var(--primary-light); }

  .answer-box {
    display: none;
    margin-top: 12px;
    background: var(--answer-bg);
    border: 1px solid var(--answer-border);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 14.5px;
    line-height: 1.9;
    white-space: pre-line;
    color: #78350f;
  }
  .answer-box.show { display: block; }
  .answer-label { font-weight: 700; color: #b45309; margin-right: 6px; }
  /* v10 新增：背诵卡片展示与自测模式开关 */
  .mode-toggle {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; color: var(--text); cursor: pointer;
    padding: 6px 12px; border: 1px solid var(--border);
    border-radius: 8px; background: #fff; user-select: none;
  }
  .mode-toggle input { accent-color: var(--primary); width: 14px; height: 14px; cursor: pointer; }
  /* v14 修改：题干字号增大，去掉灰色"提示"样式 */
  .q-text.recite-hint { font-size: 16px; line-height: 1.85; color: var(--text); margin-bottom: 10px; font-weight: 500; }
  /* v13 新增 / v14 增大：作文材料题题干——完整材料正文显示 */
  .q-text.material-text { font-size: 16px; line-height: 1.95; color: var(--text); margin-bottom: 10px; }
  .answer-box.recite { background: #f0fdf4; border-color: #86efac; color: #14532d; }
  .answer-box.recite .answer-label { color: #15803d; }
  .answer-box.recite strong { color: #15803d; }
  /* v6 新增：着重号（中文传统加点）与加粗标记 */
  .emphasis { text-emphasis: filled dot; text-emphasis-position: under right; -webkit-text-emphasis: filled dot; -webkit-text-emphasis-position: under; }
  .q-text strong, .answer-box strong { color: #1d4ed8; font-weight: 700; }
  .answer-box strong { color: #b45309; }

  .empty {
    text-align: center; color: var(--text-sub);
    padding: 60px 20px; font-size: 14px;
  }
  .empty .icon { font-size: 40px; opacity: .35; display: block; margin-bottom: 8px; }

  /* v2 新增：空题库提示与禁用按钮样式 */
  .poem-empty {
    grid-column: 1 / -1;
    padding: 22px;
    text-align: center;
    color: #b45309;
    background: var(--answer-bg);
    border: 1px dashed var(--answer-border);
    border-radius: 8px;
    font-size: 14px;
  }
  .btn-primary:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; transform: none; }

  /* v19：底部学校名牌 */
  footer {
    text-align: center;
    margin-top: 40px;
    padding: 22px 20px;
    border-radius: 12px;
    background: linear-gradient(120deg, #1e3a8a 0%, #2563eb 55%, #3b82f6 100%);
    color: #fff;
    box-shadow: 0 4px 16px rgba(37, 99, 235, .25);
  }
  footer .school-name {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 5px;
    text-shadow: 0 1px 4px rgba(0,0,0,.25);
  }
  footer .footer-sub { font-size: 12px; opacity: .85; margin-top: 6px; letter-spacing: 1px; }

  @media (max-width: 640px) {
    .hero h1 { font-size: 24px; }
    .panel { padding: 20px 16px; }
    .btn-primary { width: 100%; }
    .question-card { padding: 16px; }
  }
</style>
</head>

      { q: `【书后习题】《沁园春·长沙》意象丰富，组合巧妙，意境宏阔，具有极强的艺术感染力。以词的上阕为例，分析作者是如何描写意象、营造意境的。`, a: `上阕以"万类霜天"为中心意象，通过"万山""层林""江""百舸""鹰""鱼"等意象，营造出生机盎然、色彩绚丽的壮美意境。描写时动静结合，远近结合。视角由上到下，层次分明。` },
      { q: `"怅"写出词人怎样的心情？"问"又表达了词人什么情感？`, a: `"怅"原意"惆怅"，看到大好河山而引发的谁能主宰大地沉浮的慷慨思绪。\n"问"是对自然荣枯和社会盛衰由谁来主宰的追问，表现了诗人的凌云壮志。` },
      { q: `"携来百侣曾游，忆往昔峥嵘岁月稠。"这句话有什么作用？`, a: `过渡句，承上启下，承接上文写景，引出下文对革命岁月的回忆。` },
      { q: `下阙哪个是领字？有什么作用？`, a: `一个"恰"字，统领七句，写革命活动，形象地概括了当时年轻一代雄姿英发的风貌和气概。` },
      { q: `词的下阕忆起那段不平凡的往昔岁月，展现了青年革命者怎样的风采？`, a: `以天下为己任、蔑视反动统治者、敢于改造旧世界的革命青年。` },
      { q: `曾记否，到中流击水，浪遏飞舟？表达了作者怎样情感？`, a: `运用夸张，设问手法，对上片"谁主沉浮"的巧妙回答。表达了革命青年以天下为己任，肩负着国家兴亡、主宰民族命运的豪情壮志。` },
      { q: `【书后习题】结合词作所传达的情感，分析下列加点字的表达效果。`, a: `百舸争流：争，用拟人的修辞手法将千帆竞发的壮观场面描绘得生动形象，表达了革命青年们对革命理想的共同愿景。\n鹰击长空：击，刻画了鹰的矫健，表现出整个民族为了独立而展现的强势姿态。\n鱼翔浅底：翔，描绘出鱼在水中轻快自如的神态，暗示对自由的追求。\n万类霜天竞自由：竞，表现了一种蓬勃向上、追求解放的姿态，表明革命前景伟大光明。\n挥斥方遒：挥斥，写出了青年志士意气风发的精神面貌。\n激扬文字：激扬，写出了青年志士对世事的洞察，对国家命运前途的关心。\n粪土当年万户侯：粪土，表达了作者对反动统治势力的蔑视。\n浪遏飞舟：遏，凸显"同学少年"的青春活力，表现了奋勇进击、劈波斩浪的精神。` }
    ],
    "伐檀": [
      { q: `"伐檀""伐辐""伐轮"各表达什么意思？词语的变换达到怎样的效果？`, a: `"伐檀""伐辐""伐轮"的更换反映了伐木者劳动的繁重与艰辛。` },
      { q: `"涟""直""沦"各表达什么意思？词语的变换达到怎样的效果？`, a: `"涟""直""沦"的更换写出了黄河水波的变化，反映了伐木者内心的不平静。` },
      { q: `"三百廛""三百亿""三百囷""县貆""县特""县鹑"各表达什么意思？词语的变换达到怎样的效果？`, a: `"三百廛""三百亿""三百囷""县貆""县特""县鹑"有力地突出了贪婪的统治者无偿占有劳动成果的数量之大，掠夺之疯狂。` },
      { q: `《伐檀》"不稼不穑，胡取禾三百廛（亿、囷）兮？不狩不猎，胡瞻尔庭有县貆（特、鹑）兮？"运用了什么修辞手法？有怎样的表达效果？`, a: `运用反问(反诘)的修辞手法，连续责问，点明了统治者的剥削本质。` },
      { q: `【书后习题】《伐檀》每章均以反语作结结合具体内容，说说这些反语的作用。`, a: `各章最后两句诗"彼君子兮，不素餐（食、飧）"运用反语的修辞手法，对剥削者冷嘲热讽，点明了主题，抒发了蕴藏在胸中的反抗怒火。` },
      { q: `【书后习题】说说重章叠句在《伐檀》中的具体运用情况，体会其表达效果。`, a: `《伐檀》采用反复咏叹的方式，在内容上起到补充作用，有力表达了伐木者的反抗情绪，如三章中"伐檀""伐辐""伐轮"部分，前后相承，点明了伐檀是为造车之用，也暗示伐木者的劳动是无休止的。` }
    ],
    "念奴娇·赤壁怀古": [
      { q: `"大江东去，浪淘尽，千古风流人物"在全词中起什么作用？`, a: `全词起兴之笔，不仅写出了长江奔流的磅礴的气势，而且把江水、浪花、千古风流人物融成一片，创造了一个旷远深沉的意境，抒发了诗人对往昔英雄人物的无限怀念。` },
      { q: `"乱石穿空，惊涛拍岸，卷起千堆雪"写了哪些景物？采用了什么手法？写出了怎样的意境？`, a: `采用了比喻、拟人、夸张的手法，写了大江、乱石、惊涛、雪浪等景物，"穿"写出山崖高耸入云的动势，"拍"写出了江涛的力度，"卷"写出了波涛力量之浩大，营造出阔大雄浑的意境。` },
      { q: `"江山如画，一时多少豪杰"在全词中的作用是什么？`, a: `承上启下，由写景过渡到写人，为下阕写周瑜作了铺垫。` },
      { q: `苏轼为什么写周瑜？周瑜在苏轼笔下是什么样的形象？`, a: `仰慕英雄，怀古伤己，通过自己与周瑜的对比，抒发有志报国却壮志难酬的感慨。\n周瑜在苏轼笔下是少年得志、春风得意、英俊潇洒、从容镇定的形象。` },
      { q: `"谈笑间，樯橹灰飞烟灭"采用了什么手法？`, a: `采用了借代、夸张、反衬的手法，樯橹代指曹操的战船，形象地写出了曹操军队战船被烧毁的情景，反衬出周瑜的指挥若定。` },
      { q: `"人生如梦，一尊还酹江月"表达了词人怎样的情感？`, a: `"一尊还酹江月"既有凭吊千古风流人物的意思，也有引江月为知己，向江月寻求安慰的意思。作者从哀叹自己转为自我劝解，流露出旷达洒脱的人生态度。` },
      { q: `【书后习题】"人生如梦，一尊还酹江月"一句，有人认为流露了及时行乐的消极情绪，有人认为体现了随缘自适的旷达胸怀。结合词作内容和作者的人生经历，谈谈自己的理解。`, a: `"人生如梦，一尊还酹江月"，表面上是作者慨叹人生犹如一场梦，看似消极避世，但在作者笔下，江山依旧，人事全非，多情自扰，徒增白发，于是发出"人生如梦"的感叹。这是作者在备受打压情况下的自慰之词，但作者未想到隐退或者及时行乐，他的"一尊还酹江月"不过是要向"江月"倾诉壮志难酬的苦闷。\n他感叹"江山如画，一时多少豪杰"，通过赞美和怀念英雄人物周瑜，感叹自身壮志难酬，表现了他不忘世情的人世精神，也表达了他面对时光流转随缘自适的旷达胸怀。` }
    ],
    "国殇": [
      { q: `"操吴戈兮被犀甲，车错毂gǔ兮短兵接。"处于全诗开头，有何作用？`, a: `描绘出楚国将士的雄姿，为下文楚军壮烈牺牲做铺垫。` },
      { q: `赏析"旌蔽日兮敌若云"所用的修辞手法以及这一句的表达效果。`, a: `主要运用了比喻的修辞手法，将敌军比作逼近的乌云，写出了敌人的强大、声势的凶猛，为下文我军寡不敌众而失败埋下了伏笔，反衬出楚国将士的英勇无畏，同时生动地描绘出了浓烈的战场气氛，增强了全诗的悲壮色彩。` },
      { q: `【书后习题】"霾两轮兮絷四马，援玉枹兮击鸣鼓"在敌我悬殊、箭矢如雨的情况下，作为楚军统帅的将领为何也在此刻擂响了战鼓？表达了作者怎样的情感？`, a: `写楚军身处劣势伤亡惨重，仍然不断击鼓进军。表达了对楚军将士英勇顽强、视死如归精神的赞颂。` },
      { q: `【书后习题】"天时坠兮威灵怒，严杀尽兮弃原野。"用自己语言描述此时战场画面，表达了作者怎样的情感？`, a: `战场画面：狂风怒吼，飞沙走石，好像天神在为楚军将士的壮烈牺牲而悲怆愤怒、呼号不止。\n写出了楚军最终寡不敌众、全部战死的悲壮场面。表达了对楚军将士战败而亡卧尸荒野的痛心与愤怒。` },
      { q: `"出不入兮往不反，平原忽兮路超远"和"带长剑兮挟秦弓，首身离兮心不惩"间接表达了作者对亡去将士什么样的感情？`, a: `"出不入兮往不反，平原忽兮路超远"运用互文的手法，写出了将士出发前的雄心壮志，刻画了楚国将士受命忘身，义无反顾的英雄形象。表达作者对楚国将士的赞美。\n"带长剑兮挟秦弓，首身离兮心不惩"运用想象，表现了楚国将士们坚贞不屈的动人品格，表达了作者的崇敬与赞扬，加深了诗歌的悲壮氛围。` },
      { q: `【书后习题】诗人是怎样直接颂扬楚国将士的？`, a: `"诚既勇兮又以武，终刚强兮不可凌"写楚国将士生前的勇武刚强，凛不可犯；\n"身既死兮神以灵，子魂魄兮为鬼雄"写楚军将士身虽已死，但英灵不灭。表达了对楚军将士生是人杰、死为鬼雄的爱国主义精神的高度赞美。` },
      { q: `【书后习题】诗歌前半部分叙述激烈的战斗过程和楚国将士奋勇抗敌、血染沙场的壮烈场面，将动态描写和静态描写紧密结合，请结合具体的诗句，简要分析这样写的好处。`, a: `"操吴戈兮被犀甲，车错毂兮短兵接。旌蔽日兮敌若云，矢交坠兮士争先。凌余阵兮躐余行，左骖殪兮右刃伤。霾两轮兮四马，援玉兮击鸣鼓"是动态描写，写出了在敌方旌旗蔽日、箭矢如雨的形势下，楚国将士被坚执锐、奋力冲杀、援枹击鼓、英勇进击的激战场面。\n"天时坠兮威灵怒，严杀尽兮弃原野"是静态刻画，写出激战后楚国将士尸横原野的惨烈荒凉。\n一动一静，互为映衬，强化了战争的悲壮与惨烈，生动地展现了楚国将士面对强敌毫不畏惧、英勇搏杀、战死沙场的英雄气概和炽烈的爱国主义精神。` }
    ],
    "永遇乐·京口北固亭怀古": [
      { q: `作者运用孙权的典故表达了什么情感？`, a: `运用孙权击退曹军的典故，仰慕英雄，通过对时间流逝及物是人非的感伤，慨叹当世没有英雄力挽狂澜，振兴宋室，抵御强敌。` },
      { q: `作者运用刘裕的典故表达了什么情感？`, a: `运用刘裕起兵北伐，成就刘宋王朝的典故，仰慕英雄，表达对为政者苟安江南的不满，借此写出自己建功立业的热望。` },
      { q: `作者运用刘义隆的典故有什么作用？`, a: `运用刘义隆仓促北伐，因草率而兵败的典故，表达对为政者草率出兵的批评与告诫。` },
      { q: `作者运用拓跋焘的典故有什么作用？`, a: `运用拓跋焘击败刘宋，建造行宫的典故，表达了对北地百姓精神麻木、忘记国耻的痛心，对南宋政权不图恢复中原的不满。` },
      { q: `作者运用廉颇的典故有什么作用？`, a: `运用廉颇年纪虽老，尚且被赵王惦记的典故，以廉颇自况，表示自己虽然年老，但仍可为国所用，也同样壮志难酬、报国无门的悲愤之情。` },
      { q: `【书后习题】《永遇乐·京口北固亭怀古》中刻画自然景物和摹写历史场景的语句生动形象。找出相关语句并简要赏析。`, a: `刻画自然景物的语句\n(1)"千古江山"。词人登高望远，面对锦绣山河，感怀联想。奠定了这首词雄健豪放的风格。\n(2)"斜阳草树，寻常巷陌"。当年英雄刘裕的住处，如今已是寻常街道，在斜阳下更显萧条凄凉。写出了词人对时间流逝、英雄不再的无限怅惘之情。\n(3)"佛狸祠下，一片神鸦社鼓"。从视觉、听觉两方面，写出百姓在金人统治下迎神赛会的太平喜庆景象，和前面的画面构成鲜明对比，表现了词人无比沉痛的心情。\n摹写历史场景的语句\n(1)"想当年，金戈铁马，气吞万里如虎"。追想当年，刘裕率军北伐，马壮兵强，军威赫赫，英勇无敌，所向披靡，真有席卷万里、威如猛虎的气势。凸显了刘裕的英雄气概以及词人对英雄的仰慕之情。\n(2)"元嘉草草，封狼居胥，赢得仓皇北顾"。元嘉八年，刘义隆轻率举兵北伐，妄想追求汉代大将霍去病追击匈奴在狼居胥山筑坛祭天那样的功业，结果吃了败仗，张皇南逃，狼狈不堪。体现出词人的惋惜之情和对刘义隆草草北伐的谴责。\n(3)"四十三年，望中犹记，烽火扬州路"。回忆四十三年前，到处是金兵南侵的战火烽烟，扬州一带被金人几番茶毒。写金人入侵，烽火连天，国破家亡，给百姓带来深重灾难，表达了词人收复中原的强烈决心。` },
      { q: `"想当年，金戈铁马，气吞万里如虎"的手法是什么？表达了作者怎样的情感？`, a: `采用了借代、比喻、夸张的手法，写出了刘裕军队的威风凛凛，凸显了刘裕的英雄气概，表达了词人对刘裕的仰慕及功绩的向往。` },
      { q: `全词中的对比有哪些？`, a: `（1）英雄业绩与可悲现实对比：讽刺南宋的萎靡不振。\n（2）刘裕"气吞万里如虎"与刘义隆"赢得仓皇北顾"对比，劝诫南宋借鉴历史经验教训。\n（3）四十三年前的"烽火扬州路"与眼下的"佛狸祠下，一片神雅社鼓"对比，抒发忧国伤时的感慨。` }
    ],
    "归园田居（其一）": [
      { q: `"少无适俗韵，性本爱丘山"两句在全诗中有何作用？`, a: `开篇点明诗人从小就没有迎合世俗的气质，天性热爱山水田园，直抒胸臆，奠定全诗厌恶官场、热爱田园、淡泊高洁的感情基调，总领全篇，委婉表达了诗人进入官场却最终辞官归田的根本原因，为后文归隐田园、回归本心做铺垫。` },
      { q: `归去田园的原因？（换个问法：如何理解"误落"二字）`, a: `表达诗人自由心性和世俗本性难以调和。表达了诗人多年身陷官场，身心俱疲，痛苦不堪。根本原因是要保持精神上的自由和独立。` },
      { q: `"尘网""樊笼""羁鸟""池鱼"使用了什么手法？表达了怎么样的情感？`, a: `采用了比喻的手法，将官场比作"尘网""樊笼"，并且将"樊笼""尘网"与"田园"对比，将在官场中的自己比作"羁鸟""池鱼"，表达诗人对官场的厌恶、对自然的热爱。` },
      { q: `为什么要"守拙"？`, a: `守拙指持守愚拙的本性，即不学巧伪，不争名利，是对"适俗"而言的，从中反映了诗人对尔虞我诈的官场生活的厌恶，追求保持精神上的自由和独立。` },
      { q: `回归田园之后，诗人写了哪些景物（意象）？采用了什么手法？营造出怎样的意境（景物特点）？表达了诗人怎样的情感？`, a: `通过动静结合、远近结合、视听结合、融情于景、白描的手法，写出了宅院、草屋、榆柳、桃李、村落、炊烟、鸡鸣、狗吠，展现了宁静闲适的田园生活，表达诗人对官场的厌恶，以及对田园生活的喜爱和归田后的欣喜心情。` },
      { q: `"户庭无尘杂，虚室有余闲。久在樊笼里，复得返自然"从中可见作者的人格倾向和精神追求是怎样的？"自然"如何理解？`, a: `运用对比和比喻的修辞手法，表达作者厌恶官场，热爱田园，追求精神上的自由和独立。\n"自然"具有双重含义。一指清新可人的大自然，二指自然而然的生存方式。` },
      { q: `全诗的诗眼是"归"字，结合全诗，分析"归"的内涵。`, a: `"归"表层是诗人离开污浊官场，回归田园家园；深层是挣脱世俗束缚，回归淳朴自在的田园生活，回归顺应本心、自由自在的天性，远离世俗樊笼，回归宁静淡泊、安贫乐道的精神家园。` }
    ],
    "将进酒": [
      { q: `"君不见黄河之水天上来，奔流到海不复回"采用了什么手法？表达了什么情感？`, a: `采用了比兴、夸张、反衬的修辞手法，先言黄河以引起所咏之悲，同时将流水比喻为时光，从空间范畴，表达人生短促、时光易逝的悲叹。` },
      { q: `"君不见高堂明镜悲白发，朝如青丝暮成雪"采用了什么手法？表达了什么情感？`, a: `采用了比喻、夸张的修辞手法，用青丝和白雪喻头发，从时间范畴，表达青春难在、生命短暂的悲叹。` },
      { q: `"人生得意须尽欢，莫使金樽空对月"与上下文有怎样的联系？`, a: `上下句都是这一句的原因和背景。诗人的情感由悲转向欢，貌似消极的行状中深藏着怀才不遇而又渴望积极入世的精神。` },
      { q: `"天生我材必有用，千金散尽还复来"表达了作者怎样的情感？`, a: `"我"突出个体的主体性，"必"突出信念的坚定性，"有用"是欲有为的强力表达，"还"写出了诗人的自信与洒脱，体现了诗人的旷达豪放，透露出一种怀才不遇而又渴求建功立业，积极入世的精神。` },
      { q: `"烹羊宰牛且为乐，会须一饮三百杯"使用了什么手法？表达了作者怎样的情感？`, a: `运用了夸张的修辞手法，体现诗人在无可奈何中的开朗乐观、坚定自信。` },
      { q: `《将进酒》的主旨句采用了什么手法？表达了什么情感？`, a: `主旨句：钟鼓馔玉不足贵，但愿长醉不愿醒。使用借代的手法，"钟鼓馔玉不足贵"是对富贵生活的否定，"但愿长醉不愿醒"是历经坎坷后的无奈选择，表面的豪放透出的是内心的不平和愤懑，也是对仕途失望后的自我解嘲，表达对权贵的蔑视，以及对现实的不满。` },
      { q: `"古来圣贤皆寂寞，唯有饮者留其名"中的"寂寞"该如何理解？`, a: `寂寞意为不为世所用，默默无闻，将古代圣贤与饮者对比，说古代圣贤寂寞实则是说自己难免落入寂寞，饱含深广的忧愤和坚定不移的信念，表达壮志难酬。` },
      { q: `"陈王昔时宴平乐，斗酒十千恣欢虐"采用了什么手法？表达了什么情感？`, a: `用典，用曹植自比，表现了有志难展、借酒浇愁的心绪，蕴藏对人生的感慨，对政治的不满。` },
      { q: `李白的"万古愁"是在愁什么？这个"愁"有什么作用？`, a: `愁的是人生易老，青春不再，壮志未酬，怀才不遇，自比古人，仕途失意。"愁"与开篇之"悲"关合，与"古来圣贤皆寂寞"呼应，强化了整首诗悲愁愤激的氛围。` },
      { q: `有人认为诗的主要内容写的是及时行乐，看透人生的消极情感。你如何理解？`, a: `"人生得意须尽欢"表面及时行乐，以酒买醉，但愿长醉，但并非真正消极。而是怀才不遇，希望借酒扬名，期待施展抱负，有所作为。如"天生我材必有用，千金散尽还复来"就体现了诗人自信与洒脱，渴望积极入世的精神。正是通过这种复杂的情感交织，展现了一个交织着失望与自信、悲愤与抗争，既矛盾又统一的李白形象。` }
    ],
    "登高": [
      { q: `首联共写了几种意象？营造了怎样的意境？其中蕴含着怎样的情感？`, a: `首联通过风、天、猿、渚、沙、鸟六个意象，营造了雄浑高远，肃杀凄凉的意境，表达了诗人的孤独无依，漂泊痛苦。` },
      { q: `颔联两句写了哪两种景物，用了哪些表现手法？营造了一种怎样的意境？`, a: `颔联描写了落木和长江，采用了对比和衬托的手法，写出了自然永恒，生命短暂，营造出壮阔苍凉、沉郁悲凉的意境。` },
      { q: `试赏析"无边"与"不尽"两个词语。`, a: `"无边"和"不尽"让秋意在空间和时间上得以延长，境界更显阔大，蕴含诗人悲苦苍凉的情怀。` },
      { q: `【书后习题】体会颈联中"悲"的内涵。`, a: `两句诗饱含诗人对病困潦倒生活的感叹，对壮志难酬的无奈。诗人人生暮年，漂泊异乡，离家万里，归家无望，年老多病，季节之秋又是人生之秋，满目凄凉，更添孤寂与惆怅。` },
      { q: `尾联中"艰难"、"潦倒"二词形容的是国家还是个人？`, a: `既是国家，也是个人。客观上，"国破"与"家亡"是因果关系；主观上，诗人一直忧国忧民，为国家破亡忧心如焚。` },
      { q: `"苦恨"二字如何理解？这一联表现了作者怎样的思想境界？`, a: `"苦"是"很"的意思，"恨"是"遗憾的意思"，诗人很遗憾过早地白了双鬓，不能多为国家出力。表达了诗人忧国忧民的思想境界。` }
    ],
    "七律二首·送瘟神": [
      { q: `诗前小序写了什么？用到了哪些表达方式？表现了作者怎样的感情？`, a: `小序交代了创作背景与作者的心情，点明创作环境，融记叙、描写、抒情于一体，表达出作者对血吸虫病斗争胜利的欣喜和对人民生活的深切关心。` },
      { q: `其一各联运用了什么手法？各写了什么内容？`, a: `首联"绿水青山枉自多，华佗无奈小虫何"运用对比，借代手法追述了旧中国无法对付血吸虫病的境况，暗示了根源在于腐败、黑暗的社会制度。\n颔联"千村薜荔人遗矢，万户萧疏鬼唱歌"运用对偶、夸张，具体描述了血吸虫病肆虐下人民悲惨萧条的生活景象。从视觉、听觉两个方面写出血吸虫流行之广、为害之深，饱含作者对劳动人民的深切同情，以及对黑暗的旧社会的强烈控诉。\n颈联"坐地日行八万里，巡天遥看一千河"运用想象、夸张，用浪漫的手法、丰富的想象、时空的转换，恢弘形象地展示了岁月的流逝。作者想象跟着地球自转和公转，可以看到宇宙中的众多星河，既考察血吸虫病危害人民的地区之广，又探求如何消灭血吸虫病的有效之策，表现了作者对人民疾苦的关心和担忧。\n尾联"牛郎欲问瘟神事，一样悲欢逐逝波"运用想象，写代表劳动人民的"牛郎"关心人间疾苦。说明虽然岁月流逝，但旧中国劳动人民的悲惨境遇却没有改变，既是对诗歌内容的总结，也引出第二首诗对新中国的描述，起到了承上启下的作用。` },
      { q: `其二各联运用了什么手法？各写了什么内容？`, a: `首联"春风杨柳万千条，六亿神州尽舜尧"运用借代，写在中国共产党的领导下，劳动人民组织起来消灭了血吸虫病。描绘出新时代新中国的画面，勾画出当前春光明媚、欣欣向荣的景象，表达了对劳动人民的热情赞扬和高度评价，反映了社会主义制度的优越性。\n颔联"红雨随心翻作浪，青山着意化为桥"把自然界拟人化，写景抒情，寓情于景，描写山山水水之驯服，"随心""着意"两词，把景色的美好与作者喜悦之情融为一体，表现出6亿人民无穷智慧和创造精神。\n颈联"天连五岭银锄落，地动三河铁臂摇"用夸张的手法描绘了社会主义建设的雄伟场面，表现了人民群众的冲天干劲。\n尾联"借问瘟君欲何往，纸船明烛照天烧"运用设问的手法，对两首诗进行总括，点明了"送瘟神"的主题，表明了中国人民消灭血吸虫病、送走瘟神的决心。\n"瘟君"：尊称"瘟神"为"瘟君"，极富调侃意味，既表达了对瘟神的嘲笑，又给人战胜瘟神的幽默感，表现了作者的乐观豪迈之情。` },
      { q: `这两首诗之间有什么联系？`, a: `前一首诗是写历史，描写旧社会血吸虫病长期流行，导致广大农村凄凉萧条、劳动人民处境悲惨，深刻揭露批判了旧社会给劳动人民造成的沉重伤害。\n后一首诗是写现实，描写新中国劳动人民在社会主义制度下，振奋精神、战胜瘟神、建设伟大祖国，使祖国出现欣欣向荣的景象。\n两首诗是联章体，对比鲜明，寓情于景，深刻揭露和批判了旧中国的黑暗与落后，热情歌颂了新中国的优越与欣欣向荣。` }
    ],
    "琵琶行并序": [
      { q: `"浔阳江头夜送客，枫叶荻花秋瑟瑟"有什么作用？`, a: `交代时间地点景物，勾勒出一幅萧瑟、落寞的秋夜送客图，渲染送别时的悲凉气氛，主客惜别的惆怅之情。` },
      { q: `作者描摹音乐的段落使用了什么修辞手法？请举三例进行分析。`, a: `采用了比喻和通感的手法。（举例分析格式："……"将…比作…，写出了音乐…的特点。范例："大弦嘈嘈如急雨"将大弦的声音比作急雨，写出音乐的粗重繁促。"小弦切切如私语"将细弦的声音比作私语，写出音乐的轻细绵密）` },
      { q: `【书后习题】第2段描写音乐的手法有哪些？请举例分析。`, a: `（1）运用比喻，表现琵琶曲中复杂、细微的音响变化。\n（2）运用动词，如"拨""拢""捻""抹""挑"等，表现演奏者纯熟的指法。\n（3）运用叠词、拟声词，表现音乐的旋律。\n（4）以对环境气氛的描写，侧面烘托琵琶乐曲的出神人化。` },
      { q: `"东船西舫悄无言，唯见江心秋月白。"使用了什么表现手法？请分析其表达效果。`, a: `采用了侧面烘托，通过写东船西舫的人们都陶醉在悠然、悦耳的琵琶声中的情景，从侧面烘托出琵琶女弹奏琵琶技艺的高超。` },
      { q: `诗的第三段作者是运用什么手法来写的琵琶女身世的？主要是从哪几个方面讲述身世的？`, a: `作者运用对比的手法，用过去少年得意和今天老年失意对比，过去的年轻貌美和今天年老色衰对比，用过去的门庭若市和今天的门可罗雀对比，用过去的年年欢笑和今天的独守空船对比。` },
      { q: `【书后习题】为什么诗人说琵琶女和白居易"同是天涯沦落人"？请结合作品具体分析。`, a: `相同之处：（1）都来自京都。琵琶女"本是京城女"，白居易是"去年辞帝京"，如今都沦落异乡。（2）都有出色才华。琵琶女是名满京都的艺人，白居易是才华横溢的诗人，如今都怀才不遇，苦情相同。（3）如今都处境悲凉。琵琶女因年长色衰而嫁给商人，只身沦落江边，白居易因直言进谏而遭贬谪。\n诗人和琵琶女在身世、才华和遭遇上都有相似之处。两个形象心灵沟通，怨恨交织，唱出了"同是天涯沦落人，相逢何必曾相识"的主题。` }
    ]
  },
  /* v5 调整：诗歌诵读 15 篇共 120 题，全部为情境默写题（按最新考纲，补写空缺已不再考查）；情境角度覆盖句意理解、意象画面、手法用典、炼字赏析、情感主旨；两首《苏幕遮》以作者区分 */
  "诗歌诵读": {
    "静女（《诗经》）": [
      { q: `《静女》开篇写女子娴静美丽，在城角等候心上人。请写出这两句诗。`, a: `静女其姝，俟我于城隅。` },
      { q: `《静女》中，女子故意躲藏不现身，男子急得抓耳挠腮、徘徊不定。描写这一情景的诗句是？`, a: `爱而不见，搔首踟蹰。` },
      { q: `《静女》中，男子赞美女子所赠红色管草光彩鲜明，并借此表达对女子的爱慕。诗句是？`, a: `彤管有炜，说怿女美。` },
      { q: `《静女》中，男子认为郊野采来的嫩芽格外美好，原因在于它是心上人所赠，点明全诗主旨的句子是？`, a: `自牧归荑，洵美且异。匪女之为美，美人之贻。` },
      { q: `《静女》中"踟蹰"一词描摹出男子因女子躲藏而徘徊焦急的情态，请写出包含该词的诗句。`, a: `爱而不见，搔首踟蹰。` },
      { q: `《静女》中以"姝"字赞美女子娴静美丽，并交代约会地点。请写出这两句诗。`, a: `静女其姝，俟我于城隅。` },
      { q: `《静女》中以"娈"字写出女子容颜美好，并引出她赠送信物的情节。请写出这两句诗。`, a: `静女其娈，贻我彤管。` },
      { q: `《静女》中以"炜"字形容管草光彩鲜艳，男子借物抒怀。请写出这两句诗。`, a: `彤管有炜，说怿女美。` }
    ],
    "短歌行（曹操）": [
      { q: `《短歌行》中，诗人感叹人生短促、时光易逝，以清晨露水作比，流露深沉忧叹。诗句是？`, a: `对酒当歌，人生几何！譬如朝露，去日苦多。` },
      { q: `《短歌行》中，诗人化用《诗经》中女子思念情人的句子，表达对贤才的渴求。诗句是？`, a: `青青子衿，悠悠我心。但为君故，沉吟至今。` },
      { q: `《短歌行》中，诗人以明月难以摘取比喻贤才难得，忧思绵绵不绝。诗句是？`, a: `明明如月，何时可掇？忧从中来，不可断绝。` },
      { q: `《短歌行》中，诗人以乌鹊绕树找不到栖枝比喻贤才彷徨无所依附。诗句是？`, a: `月明星稀，乌鹊南飞。绕树三匝，何枝可依？` },
      { q: `《短歌行》结尾，诗人以周公自比，表达广纳贤才、一统天下的雄心。诗句是？`, a: `周公吐哺，天下归心。` },
      { q: `《短歌行》中，诗人感叹忧思难解，只能借酒排遣。诗句是？`, a: `慨当以慷，忧思难忘。何以解忧？唯有杜康。` },
      { q: `《短歌行》中，诗人引用《诗经·小雅》中鹿鸣宴宾的典故，表达礼遇贤才的诚意。诗句是？`, a: `呦呦鹿鸣，食野之苹。我有嘉宾，鼓瑟吹笙。` },
      { q: `《短歌行》中，写贤才不远千里前来探望，两人欢聚畅谈、重温旧情。诗句是？`, a: `越陌度阡，枉用相存。契阔谈讌，心念旧恩。` },
      { q: `《短歌行》中，以山不拒石、海不拒流比喻自己广纳贤才的胸襟。诗句是？`, a: `山不厌高，海不厌深。` },
      { q: `《短歌行》开篇，诗人把酒高歌，感叹人生几何。诗句是？`, a: `对酒当歌，人生几何！` }
    ],
    "春江花月夜（张若虚）": [
      { q: `《春江花月夜》开篇写潮水连海、明月随潮涌生的壮阔景象，勾勒出春江月夜的宏阔背景。诗句是？`, a: `春江潮水连海平，海上明月共潮生。` },
      { q: `《春江花月夜》中，写江流曲折绕过花草丰茂的原野，月光照耀花林如同细密的雪粒。诗句是？`, a: `江流宛转绕芳甸，月照花林皆似霰。` },
      { q: `《春江花月夜》中，诗人由江月引发对宇宙人生的思考：人生代代延续不尽，而江月年年相似。诗句是？`, a: `人生代代无穷已，江月年年望相似。` },
      { q: `《春江花月夜》中，写思妇与游子只能共对明月却无法互通信音，愿随月光去照耀远方之人。诗句是？`, a: `此时相望不相闻，愿逐月华流照君。` },
      { q: `《春江花月夜》结尾，写落月西沉、离情如月光洒满江边树木，余韵悠长。诗句是？`, a: `落月摇情满江树。` },
      { q: `《春江花月夜》中，写月光随波荡漾千万里，春江处处都有明月朗照。诗句是？`, a: `滟滟随波千万里，何处春江无月明。` },
      { q: `《春江花月夜》中，写江天一色、纤尘不染，唯有孤月高悬空中。诗句是？`, a: `江天一色无纤尘，皎皎空中孤月轮。` },
      { q: `《春江花月夜》中，诗人面对江月发出连串追问：谁最先看见江月，江月又何时初照人间。诗句是？`, a: `江畔何人初见月？江月何年初照人？` },
      { q: `《春江花月夜》中，写江月似乎在等待何人，而只见长江流水不断逝去。诗句是？`, a: `不知江月待何人，但见长江送流水。` },
      { q: `《春江花月夜》中，以白云飘忽、青枫浦生愁引出游子思妇的相思之情。诗句是？`, a: `白云一片去悠悠，青枫浦上不胜愁。` },
      { q: `《春江花月夜》中，写月光似怜惜思妇，在妆镜台上徘徊不去。诗句是？`, a: `可怜楼上月裴回，应照离人妆镜台。` },
      { q: `《春江花月夜》中，写鸿雁高飞却无法传递月光、鱼龙潜跃也难成书信，表现相思相隔的无奈。诗句是？`, a: `鸿雁长飞光不度，鱼龙潜跃水成文。` }
    ],
    "燕歌行并序（高适）": [
      { q: `《燕歌行并序》中，写军队敲锣击鼓开出榆关，旌旗绵延于碣石山间，声势浩大。诗句是？`, a: `摐金伐鼓下榆关，旌旆逶迤碣石间。` },
      { q: `《燕歌行并序》中，将战士在前线浴血拼杀与将帅在帐中歌舞享乐对比，揭露边将的骄纵失职。诗句是？`, a: `战士军前半死生，美人帐下犹歌舞。` },
      { q: `《燕歌行并序》中，描绘边塞深秋衰草遍野、孤城落日、兵力稀少的危急景象。诗句是？`, a: `大漠穷秋塞草腓，孤城落日斗兵稀。` },
      { q: `《燕歌行并序》中，写少妇在城南思念丈夫肝肠寸断，征人在蓟北遥望家乡徒然回首。诗句是？`, a: `少妇城南欲断肠，征人蓟北空回首。` },
      { q: `《燕歌行并序》结尾，感叹沙场征战之苦，表达对古代名将的追怀。诗句是？`, a: `君不见沙场征战苦，至今犹忆李将军。` },
      { q: `《燕歌行并序》中，写男儿本就看重驰骋沙场，天子又破格恩宠，写出征的豪迈与荣耀。诗句是？`, a: `男儿本自重横行，天子非常赐颜色。` },
      { q: `《燕歌行并序》中，写军情紧急、羽书飞传瀚海，敌方猎火照亮狼山。诗句是？`, a: `校尉羽书飞瀚海，单于猎火照狼山。` },
      { q: `《燕歌行并序》中，写边地山川萧条、胡骑猖獗如风雨侵袭。诗句是？`, a: `山川萧条极边土，胡骑凭陵杂风雨。` },
      { q: `《燕歌行并序》中，写将帅身受恩遇却轻敌致败，力尽关山仍未解围。诗句是？`, a: `身当恩遇常轻敌，力尽关山未解围。` },
      { q: `《燕歌行并序》中，以"玉箸"比喻思妇泪水，写征人久戍与家人两地相思。诗句是？`, a: `铁衣远戍辛勤久，玉箸应啼别离后。` }
    ],
    "李凭箜篌引（李白）": [
      { q: `《李凭箜篌引》中，以玉石碎裂、凤凰鸣叫、芙蓉泣露、香兰含笑描摹箜篌声的清脆与柔美。诗句是？`, a: `昆山玉碎凤凰叫，芙蓉泣露香兰笑。` },
      { q: `《李凭箜篌引》中，写乐声响彻长安十二门，连天帝也为之动容。诗句是？`, a: `十二门前融冷光，二十三丝动紫皇。` },
      { q: `《李凭箜篌引》中，以女娲补天处石破天惊来形容乐声的强烈震撼。诗句是？`, a: `女娲炼石补天处，石破天惊逗秋雨。` },
      { q: `《李凭箜篌引》中，写乐声传入神山，连老鱼和瘦蛟也为之起舞。诗句是？`, a: `梦入神山教神妪，老鱼跳波瘦蛟舞。` },
      { q: `《李凭箜篌引》结尾，以月宫中的吴质久久不眠、露水打湿寒兔收束，侧面烘托乐声动人。诗句是？`, a: `吴质不眠倚桂树，露脚斜飞湿寒兔。` },
      { q: `《李凭箜篌引》中，借湘妃泣竹、素女含愁的神话侧面烘托乐声感染力，随后点出演奏者。诗句是？`, a: `江娥啼竹素女愁，李凭中国弹箜篌。` },
      { q: `《李凭箜篌引》中，"逗"字写出乐声竟使秋雨骤降的震撼效果。请写出含"逗"字的诗句。`, a: `女娲炼石补天处，石破天惊逗秋雨。` },
      { q: `《李凭箜篌引》开篇以精良的琴材和秋空凝云侧面烘托演奏不凡。诗句是？`, a: `吴丝蜀桐张高秋，空山凝云颓不流。` }
    ],
    "过华清宫绝句三首其一（杜牧）": [
      { q: `《过华清宫绝句三首》（其一）中，写从长安回望骊山，山顶宫门依次敞开的景象。诗句是？`, a: `长安回望绣成堆，山顶千门次第开。` },
      { q: `《过华清宫绝句三首》（其一）中，以驿马扬尘、妃子一笑揭示统治者骄奢误国的名句是？`, a: `一骑红尘妃子笑，无人知是荔枝来。` },
      { q: `《过华清宫绝句三首》（其一）中，"绣成堆"既写骊山林木葱茏，又暗喻宫殿华丽。请写出含"绣成堆"的诗句。`, a: `长安回望绣成堆` },
      { q: `《过华清宫绝句三首》（其一）中，"无人知"三字暗含对统治者隐瞒民情的讽刺。请写出含"无人知"的诗句。`, a: `一骑红尘妃子笑，无人知是荔枝来` },
      { q: `《过华清宫绝句三首》（其一）中，"次第"二字写出宫门逐一敞开的动态，请写出含"次第"的诗句。`, a: `山顶千门次第开` }
    ],
    "锦瑟（李商隐）": [
      { q: `《锦瑟》开篇以锦瑟起兴，追忆逝去的美好年华，奠定全诗惆怅基调。诗句是？`, a: `锦瑟无端五十弦，一弦一柱思华年。` },
      { q: `《锦瑟》中，运用庄周梦蝶、望帝化鹃的典故，抒写迷惘哀怨之情。诗句是？`, a: `庄生晓梦迷蝴蝶，望帝春心托杜鹃。` },
      { q: `《锦瑟》中，以鲛人泣珠、蓝田玉生烟营造朦胧迷离的意境。诗句是？`, a: `沧海月明珠有泪，蓝田日暖玉生烟。` },
      { q: `《锦瑟》结尾，写往事已可追忆，而当时却一片惘然。诗句是？`, a: `此情可待成追忆，只是当时已惘然。` },
      { q: `《锦瑟》中"无端"二字写出诗人对锦瑟弦数的莫名感慨，请写出这句诗。`, a: `锦瑟无端五十弦` },
      { q: `《锦瑟》中"迷"字写出庄周梦蝶的恍惚迷离，请写出这句诗。`, a: `庄生晓梦迷蝴蝶` },
      { q: `《锦瑟》中"托"字写望帝将春心寄托于杜鹃，请写出这句诗。`, a: `望帝春心托杜鹃` },
      { q: `《锦瑟》中"惘然"二字写尽追忆往事时的迷惘，请写出这句诗。`, a: `只是当时已惘然` }
    ],
    "虞美人（李煜）": [
      { q: `《虞美人》开篇以春花秋月起笔，感叹往事无穷无尽。诗句是？`, a: `春花秋月何时了？往事知多少。` },
      { q: `《虞美人》中，写小楼又起东风，月明中回首故国，情何以堪。诗句是？`, a: `小楼昨夜又东风，故国不堪回首月明中。` },
      { q: `《虞美人》结尾，以满江春水比喻愁绪的深广绵长，成为千古名句。诗句是？`, a: `问君能有几多愁？恰似一江春水向东流。` },
      { q: `《虞美人》中"改"字写出故国宫殿依旧而人事全非的沧桑，请写出这两句。`, a: `雕栏玉砌应犹在，只是朱颜改` },
      { q: `《虞美人》中"又"字写东风又起、年复一年的无奈，请写出这句词。`, a: `小楼昨夜又东风` },
      { q: `《虞美人》中以"恰似"引出千古名句，用春水喻愁，请写出这句词。`, a: `恰似一江春水向东流` }
    ],
    "破阵子（晏殊）": [
      { q: `《破阵子》上片写春日景象：燕子归来、梨花飘落，池上青苔点点，叶底黄鹂啼鸣。诗句是？`, a: `燕子来时新社，梨花落后清明。池上碧苔三四点，叶底黄鹂一两声，日长飞絮轻。` },
      { q: `《破阵子》中，写东邻女伴含笑而来，二人在采桑小路上相遇。诗句是？`, a: `巧笑东邻女伴，采桑径里逢迎。` },
      { q: `《破阵子》下片写少女斗草获胜的喜悦，笑意浮上双颊。诗句是？`, a: `疑怪昨宵春梦好，元是今朝斗草赢，笑从双脸生。` },
      { q: `《破阵子》中"新社""清明"点明暮春时令，请写出这两句。`, a: `燕子来时新社，梨花落后清明` },
      { q: `《破阵子》中以"碧苔""黄鹂""飞絮"写春日生机，请写出这三句。`, a: `池上碧苔三四点，叶底黄鹂一两声，日长飞絮轻` },
      { q: `《破阵子》中以"斗草赢"写少女游戏获胜的欢欣，请写出这两句。`, a: `疑怪昨宵春梦好，元是今朝斗草赢` }
    ],
    "苏幕遮（范仲淹）": [
      { q: `《苏幕遮》（范仲淹）开篇写碧云黄叶、秋波寒烟，斜阳映水、芳草无情的阔远秋景。诗句是？`, a: `碧云天，黄叶地，秋色连波，波上寒烟翠。山映斜阳天接水，芳草无情，更在斜阳外。` },
      { q: `《苏幕遮》（范仲淹）中，写羁旅愁思难以排遣，除非夜夜好梦方能暂得安眠。诗句是？`, a: `黯乡魂，追旅思，夜夜除非，好梦留人睡。` },
      { q: `《苏幕遮》（范仲淹）中，写独倚高楼、借酒浇愁却化作相思泪的名句。诗句是？`, a: `明月楼高休独倚，酒入愁肠，化作相思泪。` },
      { q: `《苏幕遮》（范仲淹）中"翠"字写出寒烟的颜色，请写出这两句。`, a: `秋色连波，波上寒烟翠` },
      { q: `《苏幕遮》（范仲淹）中"无情"二字赋予芳草以人的情感，写乡愁无尽，请写出这三句。`, a: `山映斜阳天接水，芳草无情，更在斜阳外` },
      { q: `《苏幕遮》（范仲淹）中"追"字写旅思纠缠不休，请写出这两句。`, a: `黯乡魂，追旅思` }
    ],
    "雨霖铃（柳永）": [
      { q: `《雨霖铃》开篇点明送别的时间、地点与环境：寒蝉凄切，长亭暮雨刚停。诗句是？`, a: `寒蝉凄切，对长亭晚，骤雨初歇。` },
      { q: `《雨霖铃》中，写离别之际执手相望、泪眼相对却哽咽无言的场景。诗句是？`, a: `执手相看泪眼，竟无语凝噎。` },
      { q: `《雨霖铃》中，写想象中行程遥远、暮霭沉沉、楚天辽阔，烘托离愁。诗句是？`, a: `念去去，千里烟波，暮霭沉沉楚天阔。` },
      { q: `《雨霖铃》中，设想别后酒醒之时，唯有杨柳岸边晓风残月相伴。诗句是？`, a: `今宵酒醒何处？杨柳岸，晓风残月。` },
      { q: `《雨霖铃》结尾，感叹别后纵有万种情意也无人可诉。诗句是？`, a: `便纵有千种风情，更与何人说？` },
      { q: `《雨霖铃》中"催"字写出兰舟催促、不得不别的无奈，请写出这三句。`, a: `都门帐饮无绪，留恋处，兰舟催发` },
      { q: `《雨霖铃》中"凝噎"二字写出哽咽难言的情态，请写出这两句。`, a: `执手相看泪眼，竟无语凝噎` },
      { q: `《雨霖铃》中"更那堪"递进写出清秋离别的加倍伤感，请写出这三句。`, a: `多情自古伤离别，更那堪，冷落清秋节` },
      { q: `《雨霖铃》中"沉沉"写暮霭浓重、前路渺茫，请写出这三句。`, a: `念去去，千里烟波，暮霭沉沉楚天阔` },
      { q: `《雨霖铃》中"虚设"二字写出别后良辰美景形同虚设的孤寂，请写出这两句。`, a: `此去经年，应是良辰好景虚设` }
    ],
    "桂枝香·金陵怀古（王安石）": [
      { q: `《桂枝香·金陵怀古》开篇写登高远望，故国晚秋天气肃杀，澄江如练、翠峰如簇。诗句是？`, a: `登临送目，正故国晚秋，天气初肃。千里澄江似练，翠峰如簇。` },
      { q: `《桂枝香·金陵怀古》中，写彩舟淡云、星河白鹭，景象壮丽难以尽绘。诗句是？`, a: `彩舟云淡，星河鹭起，画图难足。` },
      { q: `《桂枝香·金陵怀古》中，感叹六朝旧事如流水逝去，只剩寒烟衰草一片凝绿。诗句是？`, a: `六朝旧事随流水，但寒烟衰草凝绿。` },
      { q: `《桂枝香·金陵怀古》结尾，借商女仍唱亡国之音，警示后人勿忘历史教训。诗句是？`, a: `至今商女，时时犹唱，后庭遗曲。` },
      { q: `《桂枝香·金陵怀古》中"似练"以比喻写澄江，请写出这两句。`, a: `千里澄江似练，翠峰如簇` },
      { q: `《桂枝香·金陵怀古》中"斜矗"写酒旗在西风中倾斜，请写出这两句。`, a: `归帆去棹残阳里，背西风、酒旗斜矗` },
      { q: `《桂枝香·金陵怀古》中"谩嗟"写出空叹荣辱的无奈，请写出这两句。`, a: `千古凭高对此，谩嗟荣辱` },
      { q: `《桂枝香·金陵怀古》中"竞逐"写出六朝统治者争相奢华，请写出这两句。`, a: `念往昔，繁华竞逐` }
    ],
    "苏幕遮（周邦彦）": [
      { q: `《苏幕遮》（周邦彦）中，写雨后初晴，鸟雀欢鸣，荷叶上宿雨渐干，荷叶亭亭出水。诗句是？`, a: `叶上初阳干宿雨，水面清圆，一一风荷举。` },
      { q: `《苏幕遮》（周邦彦）中，写故乡遥远、久居京城，直抒思乡之情。诗句是？`, a: `故乡遥，何日去？家住吴门，久作长安旅。` },
      { q: `《苏幕遮》（周邦彦）结尾，以梦中驾小舟驶入荷花塘作结，寄托归乡之念。诗句是？`, a: `五月渔郎相忆否？小楫轻舟，梦入芙蓉浦。` },
      { q: `《苏幕遮》（周邦彦）中"消溽暑"写焚香驱散暑气，请写出这两句。`, a: `燎沈香，消溽暑` },
      { q: `《苏幕遮》（周邦彦）中"窥檐语"写鸟雀在屋檐下鸣叫，请写出这两句。`, a: `鸟雀呼晴，侵晓窥檐语` },
      { q: `《苏幕遮》（周邦彦）中"举"字写荷叶亭亭玉立之态，请写出这三句。`, a: `叶上初阳干宿雨，水面清圆，一一风荷举` }
    ],
    "书愤（陆游）": [
      { q: `《书愤》开篇感叹年轻时不知世事艰难，北望中原豪气如山。诗句是？`, a: `早岁那知世事艰，中原北望气如山。` },
      { q: `《书愤》中，追忆当年南宋军队雪夜渡江、秋风铁马的壮烈战斗场景。诗句是？`, a: `楼船夜雪瓜洲渡，铁马秋风大散关。` },
      { q: `《书愤》中，以长城自许却壮志难酬，镜中鬓发早已斑白。诗句是？`, a: `塞上长城空自许，镜中衰鬓已先斑。` },
      { q: `《书愤》结尾，借诸葛亮《出师表》表明报国壮志千载无人能及。诗句是？`, a: `出师一表真名世，千载谁堪伯仲间！` },

      { q: `翻译句子：清风徐来，水波不兴。举酒属客，诵明月之诗，歌窈窕之章。`, a: `清风徐徐吹来，江面上水波平静。我举起酒杯，劝客人共饮，吟诵着明月的诗篇，歌唱着窈窕的诗句。` },
      { q: `翻译句子：少焉，月出于东山之上，徘徊于斗牛之间。`, a: `一会儿，月亮从东山上升起，在斗星和牛星之间徘徊。` },
      { q: `翻译句子：白露横江，水光接天。纵一苇之所如，凌万顷之茫然。`, a: `白茫茫的水气笼罩着江面，波光与星空连成一片。任凭小船往前漂去，越过那茫茫的江面。` },
      { q: `翻译句子：浩浩乎如冯虚御风，而不知其所止；飘飘乎如遗世独立，羽化而登仙。`, a: `多么辽阔呀，仿佛要凌空乘风飞去，却不知将停留在何处；多么飘逸呀，像要脱离了人世超然独立，成为神仙而飞入仙境。` },
      { q: `翻译句子：桂棹兮兰桨，击空明兮溯流光。`, a: `桂树做的棹啊木兰做的桨，划破月光下的清波啊，（船）在月光浮动的水面上逆流而上。` },
      { q: `翻译句子：渺渺兮予怀，望美人兮天一方。`, a: `我的内心想得很远很远啊，眺望那个美人啊，她却在天的那一边。` },
      { q: `翻译句子：其声呜呜然，如怨如慕，如泣如诉，余音袅袅，不绝如缕。舞幽壑之潜蛟，泣孤舟之嫠妇。`, a: `那箫声呜呜咽咽，像哀怨，又像思慕，像哭泣又像倾诉，余音婉转悠扬，像一缕不断的细丝延绵不断。使潜藏在深渊里的蛟龙起舞，使孤舟上的寡妇伤心哭泣。` },
      { q: `翻译句子：况吾与子渔樵于江渚之上，侣鱼虾而友麋鹿，驾一叶之扁舟，举匏尊以相属。`, a: `何况我同你在江洲上打鱼砍柴，以鱼虾为伴，与麋鹿为友，驾着一叶孤舟，在这里举杯互相劝酒。` },
      { q: `翻译句子：寄蜉蝣于天地，渺沧海之一粟。`, a: `像蜉蝣一样寄生在天地之间，渺小得就像大海里的一颗米粒。` },
      { q: `翻译句子：逝者如斯，而未尝往也；盈虚者如彼，而卒莫消长也。`, a: `江水总是不停地流逝，但它们并没有流走；月亮总是那样有圆有缺，但它终究也没有增减。` },
      { q: `翻译句子：盖将自其变者而观之，则天地曾不能以一瞬。`, a: `如果从它们变的一面看，那么天地间的一切事物，甚至不到一眨眼的工夫就发生了变化。` },
      { q: `翻译句子：苟非吾之所有，虽一毫而莫取。`, a: `假如不是为我所有，即使是一丝一毫也不能得到。` },
      { q: `翻译句子：是造物者之无尽藏也，而吾与子之所共适。`, a: `这是自然界无穷无尽的宝藏，我和你可以共同享受。` },
      { q: `《赤壁赋》中"其声呜呜然，如怨如慕，如泣如诉，余音袅袅，不绝如缕。舞幽壑之潜蛟，泣孤舟之嫠妇"运用了什么手法？有何作用？`, a: `比喻、夸张，突出了洞箫声带来的悲怆之情，主客触景生情，引起下文主客问答议论。` },
      { q: `《赤壁赋》中是什么触发了客人的悲情？他悲叹什么？`, a: `①古今人物的对比：将自己与曹操进行对比，悲英雄不在，功业未立。②宇宙无穷与人生短暂的对比：将长江与"吾生"对比，悲生命渺小，人生短暂。③理想与现实的矛盾：幻想"挟飞仙以遨游，抱明月而长终"，但"知不可乎骤得"，悲理想现实无法统一。` },
      { q: `《赤壁赋》以情感变化为线索，请具体说说作者的情感是怎样由乐转悲、又怎样转悲为喜的。`, a: `文本先由清风明月之美写赏玩之乐，再以主客问答写历史人物的兴亡和现实苦闷的悲，阐明变与不变的道理，以求解脱，最后归于豁达乐观。` }

      { q: `解释《烛之武退秦师》中加点词的活用：既++东++封郑`, a: `东，名词作状语，在东边；封，意动用法，以……为疆界。` },
      { q: `解释《烛之武退秦师》中加点词的活用：且++贰++于楚也`, a: `贰，数词作动词，从属二主。` },
      { q: `解释《烛之武退秦师》中加点词的活用：若++亡++郑有益于君`, a: `亡，使动用法，使……灭亡。` },
      { q: `解释《烛之武退秦师》中加点词的活用：越国以++鄙++远`, a: `鄙，意动用法，把……当作边邑；远，形容词作名词，远地。` },
      { q: `解释《烛之武退秦师》中加点词的活用：烛之武++退++秦师`, a: `退，使动用法，使……撤兵。` },
      { q: `解释《烛之武退秦师》中加点词的活用：共其++乏困++`, a: `乏困，形容词作名词，缺少的东西。` },
      { q: `解释《烛之武退秦师》中加点词的活用：与郑人++盟++`, a: `盟，动词作名词，订（建）立同盟。` },
      { q: `解释《烛之武退秦师》中加点词的活用：因人之力而++敝++之，不仁`, a: `敝，形容词作动词，损害。` },
      { q: `解释《烛之武退秦师》中加点词的活用：若不++阙++秦`, a: `阙，使动用法，使……减少。` },
      { q: `解释《烛之武退秦师》中加点词的活用：邻之++厚++，君之++薄++也`, a: `厚、薄，形容词作动词，增益、减损。` },
      { q: `《烛之武退秦师》中"++夫人++"的古义和今义分别是什么？`, a: `古义：那个人；今义："妻子"的尊称。` },
      { q: `《烛之武退秦师》中"++行李++"的古义和今义分别是什么？`, a: `古义："出使的人"；今义：出门时所带包裹。` },
      { q: `《烛之武退秦师》中"++东道主++"的古义和今义分别是什么？`, a: `古义：为东方道路上（招待过客）的主人；今义：请客的主人。` },
      { q: `解释《烛之武退秦师》中加点词：++犹++不如人`, a: `尚且。` },
      { q: `解释《烛之武退秦师》中加点词：郑++既++知亡矣`, a: `已经。` },
      { q: `解释《烛之武退秦师》中加点词：又欲++肆++其西++封++`, a: `肆：延伸、扩张；封：疆界。` },
      { q: `解释《烛之武退秦师》中加点词：++微++夫人之力不及此`, a: `没有。` },
      { q: `翻译句子：夜缒而出，见秦伯。`, a: `在夜晚有人用绳子将烛之武从城楼放下去，见到秦穆公。` },
      { q: `翻译句子：曰："秦、晋围郑，郑既知亡矣。"`, a: `烛之武说："秦、晋两国围攻郑国，郑国已经知道要灭亡了。"` },
      { q: `翻译句子：若亡郑而有益于君，敢以烦执事。`, a: `假如灭掉郑国对您有好处，怎敢冒昧地拿"亡郑"这件事麻烦您。` },
      { q: `翻译句子：越国以鄙远，君知其难也。`, a: `然而越过别国把远方的郑国作为秦国的东部边邑，您知道这是困难的。` },
      { q: `翻译句子：焉用亡郑以陪邻？邻之厚，君之薄也。`, a: `为什么要灭掉郑国而给晋国增加土地呢？晋国的势力雄厚了，您秦国的势力也就相对削弱了。` },
      { q: `翻译句子：若舍郑以为东道主。`, a: `如果您放弃围攻郑国而把它当作东方道路上招待过客的主人。` },
      { q: `翻译句子：行李之往来，共其乏困，君亦无所害。`, a: `出使的人来来往往，郑国可以随时供给他们缺乏的东西，对您也没有什么害处。` },
      { q: `翻译句子：且君尝为晋君赐矣，许君焦、瑕。`, a: `而且您曾经给予晋惠公恩惠，惠公曾经答应给您焦、瑕二座城池。` },
      { q: `翻译句子：朝济而夕设版焉，君之所知也。`, a: `然而惠公早上渡过黄河回国，晚上就在那里筑城防御，这是您所知道的。` },
      { q: `翻译句子：夫晋，何厌之有？既东封郑，又欲肆其西封。`, a: `晋国，怎么会有满足的时候呢？现在它已在东边使郑国成为它的边境，又想要向西扩大边界。` },
      { q: `翻译句子：若不阙秦，将焉取之？`, a: `如果不使秦国土地亏损，它到哪里去夺取土地？` },
      { q: `翻译句子：阙秦以利晋，唯君图之。`, a: `削弱秦国对晋国有利，希望您考虑一下！` },
      { q: `翻译句子：秦伯说，与郑人盟。使杞子、逢孙、杨孙戍之，乃还。`, a: `秦伯非常高兴，就与郑国签订了盟约。派遣杞子、逢孙、杨孙守卫郑国，秦伯就回国了。` },
      { q: `翻译句子：子犯请击之。公曰："不可。微夫人之力不及此。"`, a: `晋大夫子犯请求出兵攻击秦军。晋文公说："不行！没有秦国国君的力量，就没有我的今天。"` },
      { q: `翻译句子：因人之力而敝之，不仁。`, a: `依靠别人的力量而又反过来损害他，这是不仁义的。` },
      { q: `翻译句子：失其所与，不知。`, a: `失掉自己的同盟者，这是不明智的。` },
      { q: `翻译句子：以乱易整，不武。`, a: `用混乱相攻取代联合一致，是不符合武德的。` },
      { q: `翻译句子：吾其还也。亦去之。`, a: `我们还是回去吧！晋军也就离开了郑国。` },
      { q: `《烛之武退秦师》为什么不在第一段就描写烛之武说服秦王？第一段的作用是什么？`, a: `①渲染紧张气氛，为人物出场提供背景。②交代秦、晋围郑的理由，为下文烛之武退秦师提供了可能性。③交代秦晋两军并未合兵一处，为烛之武分化对手提供了有利条件。` },
      { q: `《烛之武退秦师》中佚之狐的话对刻画烛之武有何作用？`, a: `烛之武在佚之狐的推荐下出场，属于侧面描写，展示烛之武的才能不凡，是可用之才。` },
      { q: `《烛之武退秦师》第二段出现的三个人物分别是怎样的形象？`, a: `烛之武：以国家利益为重，深明大义。佚之狐：慧眼识英雄的伯乐。郑伯：善于听取意见，敢于自我检讨。` },
      { q: `为什么第三段要写烛之武"夜缒而出"，试分析其作用。`, a: `①结构上：照应了前文的"晋侯、秦伯围郑""国危矣"等内容。②内容上：表明形势已经相当危急，展现出烛之武的献身精神。` },
      { q: `烛之武从哪些方面说服秦穆公的？`, a: `①"秦晋围郑，郑既知亡矣"——自言知亡，降低敌意。②"若亡郑而有益于君主"到"君之薄也"——阐明利害，动摇秦军。③"若舍郑以为东道主"到"君亦无所害"——替秦着想，以利相诱。④"且君尝为晋军赐矣"到"君之所知也"——以史为鉴，挑拨秦晋。⑤"夫晋，何厌之有？"到"唯君图之"——推测未来，劝秦谨慎。关键点：亡郑对秦有害无利；晋国有扩张的野心。` },
      { q: `《烛之武退秦师》在叙事时注意伏笔与照应，请再找出几个例子简要分析。`, a: `①"夜缒而出"照应开头秦晋围郑时的危急情况。②"许君焦、瑕，朝济而夕设版焉"照应上文秦晋虽是联合行动，但貌合神离，没有驻扎在一起，这就为秦郑联盟提供了条件。` },
      { q: `分析烛之武的人物形象特点。`, a: `烛之武：不卑不亢，机智善辩。` }
    ],
    "师说": [
      { q: `《师说》中"所以传道++受++业解惑也"的"受"同哪个字？`, a: `同"授"。` },
      { q: `《师说》中"句++读++之不知"的"读"同哪个字？`, a: `同"逗"。` },
      { q: `《师说》中"授之书而习其句++读++者"的"读"同哪个字？`, a: `同"逗"。` },
      { q: `《师说》中"或师焉，或++不++焉"的"不"同哪个字？`, a: `同"否"。` },
      { q: `指出下列句子的句式特点：**师者，所以传道受业解惑也。**`, a: `判断句。` },
      { q: `指出下列句子的句式特点：**授之书而习其句读者，非吾所谓传其道解其惑者也。**`, a: `判断句。` },
      { q: `指出下列句子的句式特点：**道之所存，师之所存也。**`, a: `判断句。` },
      { q: `指出下列句子的句式特点：**不拘于时。**`, a: `被动句（"于"表被动）。` },
      { q: `指出下列句子的句式特点：**生乎吾前，其闻道也固先乎吾。**`, a: `状语后置（"乎吾前""乎吾"后置）。` },
      { q: `指出下列句子的句式特点：**夫庸知其年之先后生于吾乎？**`, a: `状语后置（"生于吾"后置）。` },
      { q: `指出下列句子的句式特点：**师不必贤于弟子。**`, a: `状语后置（"于弟子"后置）。` },
      { q: `指出下列句子的句式特点：**而耻学于师。**`, a: `状语后置（"于师"后置）。` },
      { q: `指出下列句子的句式特点：**学于余。**`, a: `状语后置（"于余"后置）。` },
      { q: `指出下列句子的句式特点：**句读之不知，惑之不解。**`, a: `宾语前置（"不知句读""不解惑"）。` },
      { q: `指出下列句子的句式特点并补出省略成分：**吾从而师之——吾从（之）而师之。**`, a: `省略句，省略宾语"之"。` },
      { q: `解释《师说》中加点词的活用：++师道++之不传也久矣`, a: `师道，从师求学的传统。师，从师求学；道，传统。` },
      { q: `解释《师说》中加点词的活用：其++下++圣人也亦远矣`, a: `下，名词作动词，不及。` },
      { q: `解释《师说》中加点词的活用：或++师++焉，或否焉`, a: `师，名词作动词，从师。` },
      { q: `解释《师说》中加点词的活用：君子不++齿++`, a: `齿，名词作动词，提起。` },
      { q: `解释《师说》中加点词的活用：吾++师++道也`, a: `师，以……为师，或作动词学习。` },
      { q: `解释《师说》中加点词的活用：吾从而++师++之`, a: `师，意动用法，以……为师。` },
      { q: `解释《师说》中加点词的活用：孔子++师++郯子`, a: `师，意动用法，以……为师。` },
      { q: `解释《师说》中加点词的活用：而++耻++学于师`, a: `耻，意动用法，以……为耻。` },
      { q: `解释《师说》中加点词的活用：则++耻++师焉`, a: `耻，意动用法，以……为耻。` },
      { q: `解释《师说》中加点词的活用：不++耻++相师`, a: `耻，意动用法，以……为耻。` },
      { q: `解释《师说》中加点词的活用：授之书而++习++其句读者`, a: `习，使动用法，使……学习。` },
      { q: `解释《师说》中加点词的活用：所以传道受业解++惑++也 / 孰能无++惑++`, a: `惑，形容词作名词，疑难问题。` },
      { q: `解释《师说》中加点词的活用：是故++圣++益圣，++愚++益愚`, a: `圣，圣人；愚，愚人。形容词作名词。` },
      { q: `解释《师说》中加点词的活用：++小++学而++大++遗`, a: `小，小的方面；大，大的方面。形容词作名词。` },
      { q: `解释《师说》中加点词的活用：其++贤++不及孔子`, a: `贤，形容词作名词，才能。` },
      { q: `解释《师说》中加点词的活用：++惑++而不从师`, a: `惑，形容词作动词，有了疑惑。` },
      { q: `《师说》中"++学者++"的古义和今义分别是什么？`, a: `古义：求学的人；今义：学术上有专门成就的人。` },
      { q: `《师说》中"++众人++"的古义和今义分别是什么？`, a: `古义：一般人；今义：大多数人、很多人。` },
      { q: `《师说》中"++小学++"的古义和今义分别是什么？`, a: `古义：小的方面学到了；今义：初等教育的学校阶段。` },
      { q: `《师说》中"++不必++"的古义和今义分别是什么？`, a: `古义：不一定；今义：用不着、不需要。` },
      { q: `《师说》中"++所以++"的古义和今义分别是什么？`, a: `古义：用来……的；今义：表因果关系的连词。` },
      { q: `《师说》中"无贵无贱，无长无少"的"++无++"古义和今义分别是什么？`, a: `古义：无论；今义：没有。` },
      { q: `《师说》中"圣人无++常++师"的"常"古义和今义分别是什么？`, a: `古义：固定的；今义：平常、普通。` },
      { q: `《师说》中"年十七，好++古文++"的"古文"古义和今义分别是什么？`, a: `古义：先秦散文；今义：泛指"五四"运动之前的所有文言文。` },
      { q: `解释《师说》中加点词：其闻++道++也固先乎吾`, a: `得知真理。道，这里指儒家之道。` },
      { q: `解释《师说》中加点词：吾++师++道也`, a: `以道为师，即学道。` },
      { q: `解释《师说》中加点词：++师道++之不传也久矣`, a: `从师求学的传统。` },
      { q: `解释《师说》中加点词：授之书而习其++句读++者`, a: `句读泛指文字的诵读。` },
      { q: `解释《师说》中加点词：士大夫之++族++`, a: `类。` },
      { q: `解释《师说》中加点词：官盛则近++谀++`, a: `阿谀，奉承。` },
      { q: `解释《师说》中加点词：君子不++齿++`, a: `不屑一提。意思是极度鄙视。` },
      { q: `解释《师说》中加点词：今其智++乃++反不能及`, a: `竟然。` },
      { q: `解释《师说》中加点词：术业有专++攻++`, a: `学习，研究。` },
      { q: `解释《师说》中加点词：六艺经++传++皆通习之`, a: `六艺：六经，指《诗》《书》《礼》《乐》《易》《春秋》。传：传记，解释六经的著作。通：普遍。` },
      { q: `解释《师说》中加点词：余++嘉++其能行古道`, a: `嘉：赞赏。古道：指古人从师之道。` },
      { q: `解释《师说》中加点词：作《师说》以++贻++之`, a: `贻：赠送。` },
      { q: `翻译句子：古之学者必有师。师者，所以传道受业解惑也。`, a: `古代求学的人一定有老师。老师，是靠他来传授道理、教授学业、解释疑难问题的。` },
      { q: `翻译句子：惑而不从师，其为惑也终不解矣。`, a: `有疑惑而不去向老师学习，这些成为疑惑的问题便始终不能解决。` },
      { q: `翻译句子：是故无贵无贱，无长无少，道之所存，师之所存也。`, a: `因此，不论地位高贵还是地位低贱，不论年长还是年少，道存在的地方，就是老师存在的地方。` },
      { q: `翻译句子：句读之不知，惑之不解，或师焉，或不焉，小学而大遗，吾未见其明也。`, a: `不理解断句停顿，有的向老师学习，不能解决疑惑，有的却不向老师求教，小的方面学习了，而大的方面却丢弃，我看不出他们是明白事理的。` },
      { q: `翻译句子：士大夫之族，曰师曰弟子云者，则群聚而笑之。`, a: `士大夫这类人，听到有人称人家为老师，称自己为学生，这些人就聚集在一起嘲笑他。` },
      { q: `翻译句子：位卑则足羞，官盛则近谀。`, a: `以地位低的人为师，则足以感到耻辱；以官大的人为师，则被认为近于谄媚。` },
      { q: `翻译句子：巫医乐师百工之人，君子不齿，今其智乃反不能及，其可怪也欤！`, a: `巫医乐师及各行各业的工匠，君子们是不屑一提的，但现在君子们的智慧竟然反而赶不上他们，这难道不值得奇怪吗？` },
      { q: `翻译句子：闻道有先后，术业有专攻，如是而已。`, a: `懂得道理有先有后，技能学业各有专门研究，如此罢了。` },
      { q: `《师说》的作者是谁？"说"是一种什么文体？`, a: `作者韩愈，唐代文学家、思想家，古文运动的倡导者。"说"是一种文体，是议论文的一种，也可算作散文。` },
      { q: `《师说》针对当时怎样的社会风气？阐述了什么主张？`, a: `文章针对当时士大夫耻于从师学习的恶劣风气，阐述了"师"的作用和标准，从师学习的重要性和从师应持的态度，提倡能者为师、不耻下问、教学相长。` },
      { q: `《师说》中"六艺经传皆通习之"的"六艺"指什么？`, a: `六艺即六经，指《诗》《书》《礼》《乐》《易》《春秋》。` },
      { q: `《师说》在写法上有什么特点？`, a: `全文气势通畅，"破"得彻底，立论正确严密，表达富于变化。环环相扣，前后照应。整齐的排偶句和灵活的散句交替运用，错落自如。` },
      { q: `《师说》的中心论点是什么？`, a: `古之学者必有师。` },
      { q: `《师说》第二段的中心句是什么？`, a: `师道之不传也久矣！欲人之无惑也难矣！` },
      { q: `《师说》第三段的中心句是什么？`, a: `圣人无常师。` },
      { q: `《师说》第二段作者从哪三方面进行对比论证？有何作用？`, a: `①"古之圣人，从师而问"与"今之众人，耻学于师"对比。②"对其子，择师而教"与"对其身，耻学于师"对比。③"巫医乐师百工之人，不耻相师"与"士大夫之族，群聚而笑之"对比。通过三组对比抨击"耻学于师"的社会风气，进一步阐明从师的必要性和以能者为师的道理。` },
      { q: `诵读并说说你的理解：师者，所以传道受业解惑也。`, a: `教师是能传授知识，解答疑惑，培养学生品德和修养的人。要注意将理想主义与实用主义、功能主义结合起来，培养既有学识又有品德的人才。` },
      { q: `诵读并说说你的理解：是故无贵无贱，无长无少，道之所存，师之所存也。`, a: `应该以能者为师，而不以年资高下、权威轻重为从师之依据。` },
      { q: `诵读并说说你的理解：是故弟子不必不如师，师不必贤于弟子。`, a: `弟子应虚心学习，敢于超越；老师应进德修业，心胸宽广。` },
      { q: `诵读并说说你的理解：闻道有先后，术业有专攻。`, a: `弟子应虚心学习，敢于超越；老师应进德修业，心胸宽广。` },
      { q: `韩愈所说的"师道"的内涵是什么？`, a: `从"吾师道也"来看，"师道"是学道的意思；从"道之所存，师之所存也"来看，"师道"是以有道者为师的意思。把这两种意思合起来看，"师道"就是以有道者为师并从而学道的意思。` },
      { q: `作者为什么称赞李蟠？`, a: `作者赞扬李蟠，既是对他不从流俗的肯定，也是对士大夫们"不从师"的有力批判；既针砭时弊，又通过赞扬李蟠倡导从师。` }
    ],
    "廉颇蔺相如列传": [
      { q: `《廉颇蔺相如列传》中"可予++不++"的"不"通哪个字？是什么意思？`, a: `通"否"，表示疑问，相当于"吗"。` },
      { q: `《廉颇蔺相如列传》中"臣愿++奉++璧往使"的"奉"通哪个字？`, a: `通"捧"，用双手恭敬地拿着。` },
      { q: `《廉颇蔺相如列传》中"召有司++案++图"的"案"通哪个字？`, a: `通"按"，意思是察看、审察。` },
      { q: `《廉颇蔺相如列传》中"唯大王与群臣++孰++计议之"的"孰"通哪个字？`, a: `通"熟"，意思是仔细、周详。` },
      { q: `《廉颇蔺相如列传》中"秦自++缪++公以来"的"缪"通哪个字？`, a: `通"穆"，指秦穆公。` },
      { q: `《廉颇蔺相如列传》中"肉袒伏斧++质++"的"质"通哪个字？`, a: `通"锧"，指古代斩人用的砧板。` },
      { q: `《廉颇蔺相如列传》中"++卒++廷见相如"的"卒"通哪个字？`, a: `通"庭"，指朝廷、朝堂（此处原文"卒廷"即"终于在朝廷"）。` },
      { q: `《廉颇蔺相如列传》中"相如度秦王特以诈++详++为予赵城"的"详"通哪个字？`, a: `通"佯"，假装。` },
      { q: `《廉颇蔺相如列传》中"设九++宾++于廷"的"宾"通哪个字？`, a: `通"傧"，傧相。` },
      { q: `指出下列句子的句式特点：**廉颇者，赵之良将也。蔺相如者，赵人也。和氏璧，天下所共传宝也。**`, a: `判断句。` },
      { q: `指出下列句子的句式特点：**臣所以去亲戚而事君者，徒慕君之高义也。强秦之所以不敢加兵于赵者，徒以吾二人在也。吾所以为此者，以先国家之急而后私仇也。**`, a: `判断句。` },
      { q: `指出下列句子的句式特点：**且相如素贱人。为赵宦者令缪贤舍人。**`, a: `判断句（无标志的判断句）。` },
      { q: `指出下列句子的句式特点：**秦城恐不可得，徒见欺。而君幸于赵王。臣诚恐见欺于王而负赵。使不辱于诸侯。**`, a: `被动句（"见""于"表被动）。` },
      { q: `指出下列句子的句式特点：**何以知之？何以效之？何以复加？君何以知燕王？**`, a: `宾语前置（"以何知之"等）。` },
      { q: `指出下列句子的句式特点：**求人可使报秦者。**`, a: `定语后置（"求可使报秦之人"）。` },
      { q: `指出下列句子的句式特点：**以勇气闻于诸侯。会于西河外渑池。请奏盆缻秦王。**`, a: `状语后置（"于诸侯""于西河外渑池"后置；"请奏盆缻秦王"即"请于秦王奏盆缻"）。` },
      { q: `指出下列句子的句式特点并补出省略成分：**相如既归，赵王以为贤大夫。欲与王为好，会于西河外渑池。于是秦王不怿，为一击缻。**`, a: `省略句，分别省略"相如""（秦赵）""（相如）"等成分。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：臣++语++曰`, a: `语，名词作动词，告诉。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：臣乃敢++上++璧`, a: `上，名词作动词，献上。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：++舍++相如广成传`, a: `舍，名词作动词，安置住宿。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：乃使其从者++衣++褐`, a: `衣，名词作动词，穿。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：++怀++其璧`, a: `怀，名词作动词，怀揣着。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：赵王++鼓++瑟`, a: `鼓，名词作动词，弹奏。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：乃++前++曰`, a: `前，名词作动词，走上前。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：左右欲++刃++相如`, a: `刃，名词作动词，杀。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：请以赵十五城为秦王++寿++`, a: `寿，名词作动词，向人进酒或献礼。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：怒发++上++冲冠`, a: `上，名词作状语，向上。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：遣相如奉璧++西++入秦`, a: `西，名词作状语，向西。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：++卒廷++见相如 / 相如++廷++叱之`, a: `廷，名词作状语，在朝堂上。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：++间++至赵矣`, a: `间，名词作状语，从小路。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：臣请++完++璧归赵`, a: `完，使动用法，使……完整无缺。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：秦王恐其++破++璧`, a: `破，使动用法，使……破碎。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：++毕++礼而++归++之`, a: `毕，使动用法，使……完毕；归，使动用法，使……回去。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：宁许以++负++秦曲`, a: `负，使动用法，使……承担。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：且庸人尚++羞++之 / 吾++羞++`, a: `羞，意动用法，以……为羞耻。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：以++先++国家之急而++后++私仇也`, a: `先、后，意动用法，以……为先；以……为后。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：宁许以负秦++曲++`, a: `曲，形容词作名词，理亏的责任。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：而绝秦赵之++欢++`, a: `欢，形容词作名词，友好关系。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：++严++大国之威以修敬也`, a: `严，形容词作动词，尊重，敬畏。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：大王必欲++急++臣`, a: `急，形容词作动词，逼迫。` },
      { q: `解释《廉颇蔺相如列传》中加点词的活用：不知将军++宽++至此也`, a: `宽，形容词作动词，宽容。` },
      { q: `《廉颇蔺相如列传》中"++贱人++"的古义和今义分别是什么？`, a: `古义：卑贱的人；今义：下贱的人。` },
      { q: `《廉颇蔺相如列传》中"++宣言++"的古义和今义分别是什么？`, a: `古义：扬言；今义：宣告，声明。` },
      { q: `《廉颇蔺相如列传》中"++所以++去亲戚而事君者"的"所以"古义和今义分别是什么？`, a: `古义：……的原因；今义：连词，表示因果关系。` },
      { q: `《廉颇蔺相如列传》中"去++亲戚++而事君者"的"亲戚"古义和今义分别是什么？`, a: `古义：包括父母兄弟在内的亲人；今义：不包括父母兄弟在内的亲人。` },
      { q: `《廉颇蔺相如列传》中"++因++宾客至蔺相如门谢罪"的"因"古义和今义分别是什么？`, a: `古义：通过；今义：因为。` },
      { q: `《廉颇蔺相如列传》中"++鄙贱++之人"的古义和今义分别是什么？`, a: `古义：地位低下，见识浅薄；今义：品质恶劣。` },
      { q: `《廉颇蔺相如列传》中"其++势必++不敢留君"的"势必"古义和今义分别是什么？`, a: `古义：形势下一定；今义：根据形势推测必然会怎样。` },
      { q: `《廉颇蔺相如列传》中"传以示++美人++及左右"的"美人"古义和今义分别是什么？`, a: `古义：指秦王的姬妾；今义：美丽的人。` },
      { q: `《廉颇蔺相如列传》中"乃++辞谢++"的古义和今义分别是什么？`, a: `古义：婉言道歉；今义：很客气地推辞不受。` },
      { q: `《廉颇蔺相如列传》中"未尝有坚明++约束++者也"的"约束"古义和今义分别是什么？`, a: `古义：遵守约定；今义：限制使不越出范围。` },
      { q: `《廉颇蔺相如列传》中"++明年++复攻赵"的"明年"古义和今义分别是什么？`, a: `古义：第二年；今义：今年的下一年。` },
      { q: `《廉颇蔺相如列传》中"于是相如++前进++缶"的"前进"古义和今义分别是什么？`, a: `古义：上前进献；今义：向前行动或发展。` },
      { q: `解释《廉颇蔺相如列传》中加点词：秦以十五城请++易++璧`, a: `交换。` },
      { q: `解释《廉颇蔺相如列传》中加点词：++徒++见欺`, a: `白白地。` },
      { q: `解释《廉颇蔺相如列传》中加点词：++徒++以吾两人在也`, a: `只、仅仅。` },
      { q: `解释《廉颇蔺相如列传》中加点词：相如因持璧++却++立`, a: `后退。` },
      { q: `解释《廉颇蔺相如列传》中加点词：相如++度++秦王特以诈详为予赵城`, a: `揣度、估计。` },
      { q: `解释《廉颇蔺相如列传》中加点词：廉颇++宣言++曰`, a: `公开扬言。` },
      { q: `解释《廉颇蔺相如列传》中加点词：++先++国家之急而++后++私仇也`, a: `危急、急难（名词）。` },
      { q: `解释《廉颇蔺相如列传》中加点词：++因++宾客至蔺相如门谢罪`, a: `通过、经由。` },
      { q: `解释《廉颇蔺相如列传》中加点词：++鄙贱++之人`, a: `粗俗卑贱的人。` },
      { q: `解释《廉颇蔺相如列传》中加点词：卒相与++欢++`, a: `和好、交好。` },
      { q: `解释《廉颇蔺相如列传》中加点词：++拜++为上卿`, a: `授予官职。` },
      { q: `解释《廉颇蔺相如列传》中加点词：为赵宦者令缪贤++舍人++`, a: `首领。` },
      { q: `解释《廉颇蔺相如列传》中加点词：相如持其璧++睨++柱`, a: `斜视。` },
      { q: `解释《廉颇蔺相如列传》中加点词：++唯++大王与群臣孰计议之`, a: `希望。` },
      { q: `解释《廉颇蔺相如列传》中加点词：礼节甚++倨++`, a: `傲慢。` },
      { q: `解释《廉颇蔺相如列传》中加点词：且相如++素++贱人`, a: `地位卑微之人。` },
      { q: `解释《廉颇蔺相如列传》中加点词：臣所以去亲戚而++事++君者`, a: `……的原因（事：侍奉）。` },
      { q: `翻译句子：蔺相如者，赵人也，为赵宦者令缪贤舍人。`, a: `蔺相如是赵国人，做赵国宦官头目缪贤的门客。` },
      { q: `翻译句子：欲予秦，秦城恐不可得，徒见欺；欲勿予，即患秦兵之来。`, a: `想要给秦国，又怕秦国的城池得不到，白白地被欺骗；想要不给，又担心秦军来犯。` },
      { q: `翻译句子：均之二策，宁许以负秦曲。`, a: `比较这两个对策，宁可答应（给璧），让秦国承担理亏的责任。` },
      { q: `翻译句子：王必无人，臣愿奉璧往使。城入赵而璧留秦；城不入，臣请完璧归赵。`, a: `大王如果实在没有合适的人，我愿意捧着和氏璧出使秦国。城池划归赵国，就把璧留在秦国；城池得不到，我保证使璧完整无损地回到赵国。` },
      { q: `翻译句子：相如视秦王无意偿赵城，乃前曰："璧有瑕，请指示王。"`, a: `蔺相如看出秦王没有诚意补偿赵国城池，就走上前说："璧上有斑点，请让我指给大王看。"` },
      { q: `翻译句子：相如因持璧却立，倚柱，怒发上冲冠。`, a: `蔺相如于是手持着璧退后几步站定，靠着柱子，愤怒得头发竖起，顶起了帽子。` },
      { q: `翻译句子：大王必欲急臣，臣头今与璧俱碎于柱矣！`, a: `我看大王没有诚意补偿赵王城池，所以我又取回了璧。大王如果一定要逼迫我，我的脑袋今天就与这块璧一起撞碎在柱子上！` },
      { q: `翻译句子：左右欲刃相如，相如张目叱之，左右皆靡。`, a: `秦王身边的侍从要用刀杀相如，相如瞪着眼睛大声呵斥他们，侍从们都吓得倒退。` },
      { q: `翻译句子：且相如素贱人，吾羞，不忍为之下。`, a: `况且蔺相如本来是卑贱的人，我感到羞耻，不甘心位居他之下。` },
      { q: `翻译句子：臣所以去亲戚而事君者，徒慕君之高义也。`, a: `我们之所以离开亲人来侍奉您，只是因为仰慕您的高尚品德啊。` },
      { q: `翻译句子：公之视廉将军孰与秦王？`, a: `你们看廉将军与秦王相比，谁更厉害？` },
      { q: `翻译句子：吾所以为此者，以先国家之急而后私仇也。`, a: `我之所以这样做，是因为把国家的急难放在前面，而把个人的私仇放在后面啊。` },
      { q: `《廉颇蔺相如列传》一共包含哪几个故事？`, a: `①完璧归赵②渑池之会③将相和（负荆请罪、廉蔺交欢）。` },
      { q: `蔺相如发现秦王"无意偿赵城"后怎么办？`, a: `①设计智取。（璧有瑕，请指示王。）②说理斗争。（布衣之交尚不相欺／严大国之威以修敬也。）③誓死捍卫。（怒发上冲冠／臣头今与璧俱碎于柱。）` },
      { q: `"将相和"这一部分采用了什么手法来展现廉颇、蔺相如的性格特点？`, a: `采用对比的手法，展现了蔺相如以国家为先的宽大胸怀，也展示出廉颇的居功自傲和知错能改。` },
      { q: `写赵国君臣议而不决，有什么用意？`, a: `突出两国矛盾与实力悬殊，交代故事缘起，为相如出场作铺垫，情节陡然紧张起来，同时烘托相如胆识。` },
      { q: `渑池之会中廉颇的话表现了他对待国家大事怎样的态度？`, a: `考虑到渑池会的最坏结果：秦方扣留赵王。以"请立太子为王"击破秦的阴谋。说明他谨慎持重，对敌斗争坚决，有长远眼光。` },
      { q: `分析《廉颇蔺相如列传》中廉颇与蔺相如的性格特征。`, a: `蔺相如：大智大勇、不畏强暴、胸怀坦荡、忠君爱国。廉颇：目光长远、有勇有谋、以国为重、勇于改过。` }
    ],
    "种树郭橐驼传": [
      { q: `解释《种树郭橐驼传》中加点词：++驼业++种树`, a: `业，以……为业。` },
      { q: `解释《种树郭橐驼传》中加点词：++名++我固当`, a: `名，称呼。` },
      { q: `解释《种树郭橐驼传》中加点词：早++实++以++蕃++`, a: `实，结果实；蕃，繁盛。` },
      { q: `解释《种树郭橐驼传》中加点词：能顺木之++天++`, a: `天，天性。` },
      { q: `解释《种树郭橐驼传》中加点词：其++本++欲舒`, a: `本，根；欲，要。` },
      { q: `解释《种树郭橐驼传》中加点词：其++培++欲平`, a: `培，培土。` },
      { q: `解释《种树郭橐驼传》中加点词：其++筑++欲密`, a: `筑，捣土。` },
      { q: `解释《种树郭橐驼传》中加点词：++既然++已`, a: `既然，这样之后。` },
      { q: `解释《种树郭橐驼传》中加点词：其++莳++也若子`, a: `莳，栽种。` },
      { q: `解释《种树郭橐驼传》中加点词：根++拳++而土++易++`, a: `拳，拳曲，伸展不开；易，换。` },
      { q: `解释《种树郭橐驼传》中加点词：++爪++其肤以验其生枯`, a: `爪，用指甲抠。` },
      { q: `解释《种树郭橐驼传》中加点词：而木之性日以++离++矣`, a: `离，背离。` },
      { q: `解释《种树郭橐驼传》中加点词：移之++官理++`, a: `官理，做官治民。` },
      { q: `解释《种树郭橐驼传》中加点词：好++烦++其令`, a: `烦，繁多。` },
      { q: `解释《种树郭橐驼传》中加点词：而++卒++以祸`, a: `卒，最终。` },
      { q: `解释《种树郭橐驼传》中加点词：++勖++尔植`, a: `勖，勉励。` },
      { q: `解释《种树郭橐驼传》中加点词：早织而++缕++`, a: `缕，线。` },
      { q: `解释《种树郭橐驼传》中加点词：++字++而幼孩`, a: `字，养育。` },
      { q: `解释《种树郭橐驼传》中加点词：++遂++而鸡豚`, a: `遂，养好。` },
      { q: `解释《种树郭橐驼传》中加点词：吾++小人++辍飧饔以劳吏者`, a: `小人，小民百姓；饔，早饭。` },
      { q: `解释《种树郭橐驼传》中加点词：故++病++且怠`, a: `病，困苦。` },
      { q: `翻译句子：且硕茂，早实以蕃。`, a: `而且长得高大茂盛，果实结得早而且多。` },
      { q: `翻译句子：他植者虽窥伺效慕，莫能如也。`, a: `其他种植的人即使暗中观察效仿，也没有谁能比得上他的。` },
      { q: `翻译句子：橐驼非能使木寿且孳也，能顺木之天，以致其性焉尔。`, a: `我并不能使树木活得长久而且长得很快，不过是能够顺应树木的自然生长规律，使它的本性充分发展而已。` },
      { q: `翻译句子：其莳也若子，其置也若弃，则其天者全而其性得矣。`, a: `栽种时要像对待子女一样细心，栽好后要像丢弃它一样放在一边，那么树木的天性就得以保全，它的本性也就能够得到充分发展。` },
      { q: `翻译句子：他植者则不然，根拳而土易，其培之也，若不过焉则不及。`, a: `其他种树人却不是这样，树根拳曲着，又换上了新土，给树培土的时候，不是过紧就是太松。` },
      { q: `翻译句子：爪其肤以验其生枯，摇其本以观其疏密，而木之性日以离矣。`, a: `掐破树皮来观察它是死是活，摇动树的根部来看培土是松还是紧，这样树木的天性就一天天远去了。` },
      { q: `翻译句子：官命促尔耕，勖尔植，督尔获，早缫而绪，早织而缕，字而幼孩，遂而鸡豚。`, a: `长官命令催促你们耕地，勉励你们种植，督促你们收获，早些煮茧抽丝，早些织好你们的布，养育好你们的孩子，喂养好你们的家禽牲畜。` },
      { q: `翻译句子：吾小人辍飧饔以劳吏者，且不得暇，又何以蕃吾生而安吾性耶？`, a: `我们这些小百姓停止吃早、晚饭去慰劳那些小吏尚且不得空暇，又怎能使我们的人口兴旺，使我们生活安定呢？` },
      { q: `翻译句子：吾问养树，得养人术。传其事以为官戒也。`, a: `我问种树的方法，得到了治民的方法。我为这件事作传把它作为官吏们的鉴戒。` },
      { q: `哪句话可以概括郭橐驼的种树经验？并分析这句话的含义。`, a: `"能顺木之天，以致其性焉尔"总括了郭橐驼的种树经验。简单明了地揭示了要顺应万物的生长规律。` },
      { q: `第三段采用何种手法来验证郭橐驼种树技艺的高超？`, a: `采用对比的手法，从种树方法、种后态度、种树结果、原因分析四个方面，将郭橐驼和他植者进行对比，突出强调郭橐驼种树技艺的高超，揭示了"能顺木之天，以致其性焉尔"的道理。` },
      { q: `郭橐驼将种树之法"移之官理"使用了什么手法？有何好处？`, a: `采用类比的手法，将种树之道和为官之道进行类比，含蓄地批评了当时地方官吏扰民、伤民的行为，反映出作者对人民遭遇的同情和改革弊政的愿望。` },
      { q: `本文采用寓言式人物传记的方式来讽喻时政，请试作简析。`, a: `以寓言的方式进行讽谏，委婉含蓄地说明要顺应百姓的生活习惯和生产规律，揭露并讽刺了统治者的繁政扰民给百姓带来的灾祸，提出为政宜简，让百姓安居乐业的主张。` },
      { q: `课文是一篇寓言体传记散文，说说课文的寓意。`, a: `郭橐驼的种树理念体现了顺应自然的思想，课文借其"种树之道"表达"养人之术"，其中蕴含的寓意是上层统治者为政宜简，要顺应百姓的生活习惯和生产规律，让他们休养生息。` }
    ],

      { q: `指出下列句子的句式特点：**此为何若人？为与此同类。**`, a: `判断句。` },
      { q: `指出下列句子的句式特点：**宋何罪之有？胡不见我于王？**`, a: `宾语前置（"宋有何罪"；"胡不见我于王"中"于王"为状语后置）。` },
      { q: `指出下列句子的句式特点：**起于鲁。行十日十夜而至于郢。荆国有余于地。争于明者。治于神者。**`, a: `状语后置（"于鲁""于郢""于地""于明""于神"后置）。` },
      { q: `指出下列句子的句式特点并补出省略成分：**将以攻宋。请献十金。再拜。知而不争。胡不已乎。必取宋。**`, a: `省略句，分别省略"之"（云梯）、"之"（公输盘）、主语（子墨子）、宾语"之"（楚王）、主语（公输盘）、主语（楚王或我）。` },
      { q: `解释《公输》中加点词的活用：犀兕麋鹿++满++之`, a: `满，形容词作动词，充满。` },
      { q: `解释《公输》中加点词的活用：江汉之鱼鳖鼋鼍为天下++富++`, a: `富，形容词作名词，富足的资源。` },
      { q: `解释《公输》中加点词的活用：在宋城上而待楚++寇++`, a: `寇，名词作动词，入侵。` },
      { q: `解释《公输》中加点词的活用：虽杀臣，不能++绝++也`, a: `绝，形容词作动词，断绝，这里指杀尽。` },
      { q: `解释《公输》中加点词的活用：吾++义++固不杀人`, a: `义，名词作动词，坚守道义。` },
      { q: `解释《公输》中加点词的活用：公输盘九设攻城之++机变++`, a: `机变，名词作动词，使用巧妙器械。` },
      { q: `解释《公输》中加点词的活用：臣以王吏之攻宋也，为与++此同类`, a: `同，使动用法，使……相同。` },
      { q: `《公输》中"++再++拜"的"再"古义和今义分别是什么？`, a: `古义：两次；今义：又一次，重复。` },
      { q: `《公输》中"吾知++所以++距子矣"的"所以"古义和今义分别是什么？`, a: `古义：用来……的方法；今义：表因果关系的连词。` },
      { q: `《公输》中"荆之++地方++五千里"的"地方"古义和今义分别是什么？`, a: `古义：土地方圆；今义：指某一区域、地点，或指领土。` },
      { q: `《公输》中"++虽然++，公输盘为我为云梯"的"虽然"古义和今义分别是什么？`, a: `古义：虽然如此、尽管如此；今义：表让步关系的连词。` },
      { q: `解释《公输》中加点词：不可谓++知类++`, a: `明白事理。` },

      { q: `解释《公输》中加点词：胡不++见++我于王`, a: `引见。` },
      { q: `解释《公输》中加点词：舍其++文轩++`, a: `装饰华美的车。` },
      { q: `解释《公输》中加点词：邻有++敝舆++而欲窃之`, a: `破旧的车。` },
      { q: `解释《公输》中加点词：邻有++短褐++而欲窃之`, a: `粗布衣服。` },
      { q: `解释《公输》中加点词：舍其++粱肉++`, a: `好饭好菜。` },
      { q: `解释《公输》中加点词：邻有++糠糟++而欲窃之`, a: `粗劣饭食。` },
      { q: `解释《公输》中加点词：此犹文轩之与敝舆也——之与`, a: `……同……相比。` },
      { q: `解释《公输》中加点词：++虽然++`, a: `即使如此。` },
      { q: `翻译句子：吾义固不杀人。`, a: `我坚守道义，坚决不杀人。` },
      { q: `翻译句子：杀所不足而争所有余，不可谓智。`, a: `如今去损失自己缺少的民众而争夺自己并不缺少的土地，不能说是聪明。` },
      { q: `翻译句子：公输盘九设攻城之机变，子墨子九距之。`, a: `公输盘多次设置攻城的巧妙战术，墨子多次抵御了他。` },
      { q: `翻译句子：公输盘诎，而曰："吾知所以距子矣，吾不言。"`, a: `公输盘（虽然）屈服了，但他说："我知道用什么方法来对付你了，我不说。"` },
      { q: `翻译句子：子墨子曰："然，胡不已乎？"`, a: `墨子说："但是，为什么不停止呢？"` },
      { q: `文中哪一句交代了事件的起因？`, a: `公输盘为楚造云梯之械，成，将以攻宋。` },
      { q: `文中交待墨子匆匆行程的几个动词是什么？反映了墨子怎样的心态和精神？`, a: `几个动词是"闻""起""行""至"。这一连串的动词反映了墨子焦急的心态和为了阻止楚宋之战不辞劳苦的精神。` },
      { q: `墨子抓住公输盘"吾义固不杀人"一语，怎样驳斥了他的"义"？`, a: `首先指出"宋何罪之有"，再用"不可谓智""不可谓仁""不可谓忠""不可谓强""不可谓知类"，从各个角度批判了公输盘的行为，"义不杀少而杀众"一句，揭示出公输盘所标榜的"义"的欺骗性。` },
      { q: `从墨子的言行分析，墨子是一个什么样的人？`, a: `①墨子听说公输盘为楚国造云梯要攻打宋国，不远千里，走了十天十夜到楚国国都来说服公输盘，表现墨子不畏艰辛，反对不正义战争的"非攻"思想。②墨子折服公输盘和楚王的巧妙、锋利的言辞，表现墨子是个出色的思想家和政治活动家，具有机灵、雄辩的口才。③墨子冒着生命危险只身深入敌国，说服公输盘和楚王，表现墨子为了阻止不正义战争不怕牺牲的勇敢精神。④墨子九距公输盘攻城之机变，说明墨子有勇有谋。` },
      { q: `墨子劝阻楚国攻打宋国，可分为哪三个步骤？`, a: `①以义相责攻宋行为，使公输盘理屈词穷；②以智相责攻宋行为，使楚王理屈词穷；③模拟攻守，击败公输盘，以技相较，促使楚王放弃攻宋。` }

      { q: `指出下列句子的句式特点：**六国破灭，非兵不利，战不善，弊在赂秦。赂秦而力亏，破灭之道也。**`, a: `判断句。` },

      { q: `解释《六国论》中加点词的活用：++日++削++月++割`, a: `日，一天一天地；月，一月一月地。名词作状语。` },
      { q: `解释《六国论》中加点词的活用：++理++固宜然`, a: `理，按理。名词作状语。` },
      { q: `解释《六国论》中加点词的活用：++小++则获邑，++大++则得城`, a: `小，小的地盘；大，大的地盘。形容词作名词。` },
      { q: `解释《六国论》中加点词的活用：始++速++祸焉`, a: `速，招致。` },
      { q: `解释《六国论》中加点词的活用：赂秦而力++亏++`, a: `亏，使动用法，使……亏损。` },
      { q: `解释《六国论》中加点词的活用：李牧连++却++之`, a: `却，使动用法，使……退却。` },
      { q: `解释《六国论》中加点词的活用：惜其用武而不++终++也`, a: `终，坚持到底。` },
      { q: `《六国论》中"++其实++亦百倍"的"其实"古义和今义分别是什么？`, a: `古义：它的实际数目；今义：表示所说的是实际情况。` },
      { q: `《六国论》中"思厥先++祖父++"的"祖父"古义和今义分别是什么？`, a: `古义：祖辈与父辈；今义：父亲的父亲。` },
      { q: `《六国论》中"++至于++颠覆"的"至于"古义和今义分别是什么？`, a: `古义：以致，以至于；今义：表示另提一事。` },
      { q: `《六国论》中"可谓++智力++孤危"的"智力"古义和今义分别是什么？`, a: `古义：智谋和力量；今义：指人认识、理解客观事物的能力。` },
      { q: `《六国论》中"刺客++不行++"的"不行"古义和今义分别是什么？`, a: `古义：不去（行刺）；今义：不可以。` },
      { q: `《六国论》中"犹有++可以++不赂而胜之之势"的"可以"古义和今义分别是什么？`, a: `古义：可以凭借；今义：表示许可。` },
      { q: `《六国论》中"后秦击赵者++再++"的"再"古义和今义分别是什么？`, a: `古义：两次；今义：又一次。` },
      { q: `《六国论》中"下而从六国破亡之++故事++"的"故事"古义和今义分别是什么？`, a: `古义：旧事；今义：文学题材。` },
      { q: `解释《六国论》中加点词：++率++赂秦耶`, a: `全都。` },
      { q: `解释《六国论》中加点词：盖失强援，不能独++完++`, a: `保全。` },
      { q: `解释《六国论》中加点词：思厥先++祖父++`, a: `祖辈父辈。` },
      { q: `解释《六国论》中加点词：暴秦之欲无++厌++`, a: `满足。` },
      { q: `解释《六国论》中加点词：故不战而强弱胜负已++判++矣`, a: `决定。` },
      { q: `解释《六国论》中加点词：++理++固宜然`, a: `按理。` },
      { q: `解释《六国论》中加点词：终继五国++迁灭++`, a: `灭亡。` },
      { q: `解释《六国论》中加点词：++与++嬴而不助五国也`, a: `亲附，亲近。` },
      { q: `解释《六国论》中加点词：始++速++祸焉`, a: `招致。` },
      { q: `解释《六国论》中加点词：++洎++牧以谗诛`, a: `等到。` },
      { q: `解释《六国论》中加点词：惜其用武而不++终++也`, a: `坚持到底。` },
      { q: `解释《六国论》中加点词：++当++与秦相较`, a: `通"倘"，如果；较，较量、抗衡。` },
      { q: `解释《六国论》中加点词：以++事++秦之心++礼++天下之奇才`, a: `事，侍奉；礼，礼遇。` },
      { q: `解释《六国论》中加点词：为秦人积威之所++劫++`, a: `胁迫，挟持。` },
      { q: `解释《六国论》中加点词：++为++国者无使为积威之所劫哉`, a: `为，治理；积威，积久而成的威势。` },
      { q: `解释《六国论》中加点词：++下++而从六国破亡之故事`, a: `下，降低身份；故事，旧事。` },
      { q: `翻译句子：六国破灭，非兵不利，战不善，弊在赂秦。`, a: `六国灭亡，不是武器不锋利，仗打得不好，弊病在于贿赂秦国。` },
      { q: `翻译句子：赂秦而力亏，破灭之道也。`, a: `贿赂秦国，（自己的）实力就亏损，这是灭亡的道路啊。` },
      { q: `翻译句子：思厥先祖父，暴霜露，斩荆棘，以有尺寸之地。`, a: `想想他们的祖先，冒着霜露，披荆斩棘，才得到很少的土地。` },
      { q: `翻译句子：然则诸侯之地有限，暴秦之欲无厌，奉之弥繁，侵之愈急。`, a: `既然这样，那么诸侯的土地是有限的，贪暴的秦国的欲望却是没有满足的，（六国）送给秦越多，（秦国）侵犯六国就越厉害。` },
      { q: `翻译句子：则胜负之数，存亡之理，当与秦相较，或未易量。`, a: `那么胜败存亡的命运，如果和秦国相抗衡，（结局）或许不是轻易可以确定的。` },
      { q: `翻译句子：苟以天下之大，下而从六国破亡之故事，是又在六国下矣。`, a: `如果以偌大的天下，而采取下策追随六国灭亡的旧事，那就又在六国之下了。` },
      { q: `《六国论》的作者是谁？文章借议论六国灭亡批评了什么？`, a: `作者苏洵，北宋散文家。文章通过议论六国灭亡，批评北宋朝廷以钱帛贿赂契丹、西夏以求苟安的国策。` },
      { q: `《六国论》的中心论点是什么？提出方式有何特点？文章从哪些方面论证？`, a: `中心论点：六国破灭，弊在赂秦。先提出论点，然后以论据论证论点，好处是开门见山，简洁明快。两个分论点："赂秦而力亏，破灭之道也""不赂者以赂者丧"。` }
    ]
  },
  /* v9 新增 / v11 扩充一元材料 / v12 扩充二元材料 / v13 改造材料题（题干=材料全文，答案=关键词）：作文写作 8 类题目形式，共 73 条（53 条模板 + 10 则一元作文材料 + 10 则二元作文材料）；每条直接标注 form */
  "作文写作": {
    "写作模板": [
      /* 一元作文标题模板 9 条 */
      { form: "一元作文标题模板", q: `一元作文标题模板：以"舟"为意象拟题`, a: `以（关键词）为舟，扬起成功/理想/青春/成长/时代/人生的风帆` },
      { form: "一元作文标题模板", q: `一元作文标题模板：以"底色"为意象拟题`, a: `以（关键词）为底色，书写成功/理想/青春/成长/时代/人生的传奇` },
      { form: "一元作文标题模板", q: `一元作文标题模板：以"翼"为意象拟题`, a: `以（关键词）为翼，飞向成功/理想/青春/成长/时代/人生的彼岸` },
      { form: "一元作文标题模板", q: `一元作文标题模板：以"灯"为意象拟题`, a: `以（关键词）为灯，照亮成功/理想/青春/成长/时代/人生之路` },
      { form: "一元作文标题模板", q: `一元作文标题模板："你若……便是晴天"句式`, a: `你若（关键词），便是晴天/幸福/成长等` },
      { form: "一元作文标题模板", q: `一元作文标题模板："深耕……笃行致远"句式`, a: `深耕（关键词），笃行致远` },
      { form: "一元作文标题模板", q: `一元作文标题模板："以……之心，赴人生之程"句式`, a: `以（关键词）之心，赴人生之程` },
      { form: "一元作文标题模板", q: `一元作文标题模板："……：成长最美的底色"句式`, a: `（关键词）：成长最美的底色` },
      { form: "一元作文标题模板", q: `一元作文标题模板："……：成功最好的密钥"句式`, a: `（关键词）：成功最好的密钥` },
      /* 二元作文标题模板 6 条 */
      { form: "二元作文标题模板", q: `二元作文标题模板："始于……成于……终于……"句式`, a: `始于（关键词A），成于（关键词B），终于（关键词C）` },
      { form: "二元作文标题模板", q: `二元作文标题模板："诵……之诗，歌……之章"句式`, a: `诵（关键词A）之诗，歌（关键词B）之章` },
      { form: "二元作文标题模板", q: `二元作文标题模板："……与……齐飞，……共……一色"句式`, a: `（关键词A）与（关键词B）齐飞，……共……一色` },
      { form: "二元作文标题模板", q: `二元作文标题模板："以……为基，以……为光"句式`, a: `以（关键词A）为基，以（关键词B）为光` },
      { form: "二元作文标题模板", q: `二元作文标题模板："……共生，方得圆满"句式`, a: `（关键词A） （关键词B）共生，方得圆满` },
      { form: "二元作文标题模板", q: `二元作文标题模板："执……守……，行稳致远"句式`, a: `执（关键词A）守（关键词B），行稳致远` },
      /* 开头&结尾&分论点模板 19 条 */
      { form: "开头&结尾&分论点模板", q: `作文框架：小作文五段式结构是怎样的？`, a: `作文标题\n第一段：开头模板\n第二段：分论点1+素材句+论证句+小结句\n第三段：分论点2+素材句+论证句+小结句\n第四段：分论点3+素材句+论证句+小结句\n第五段：结尾模板` },
      { form: "开头&结尾&分论点模板", q: `一元作文开头模板：历史长河与古圣先贤意象`, a: `历史长河奔涌着无数文明的浪花，当古圣先贤在星空下仰望真理时，当匠人在岁月里雕琢匠心时，人类始终以（主题词）为舟，在浩瀚时空中破浪前行。【1句话概述材料】，唯有（动词+主题词），我们才能在未来的道路上，书写更加辉煌的篇章。` },
      { form: "开头&结尾&分论点模板", q: `一元并列式分论点①：源头活水喻`, a: `（主题词）是浇灌生命的源头活水，为有源头活水来。` },
      { form: "开头&结尾&分论点模板", q: `一元并列式分论点②：星星之火喻`, a: `（主题词）是点燃人生的星星之火，星星之火可燎原。` },
      { form: "开头&结尾&分论点模板", q: `一元并列式分论点③：开山之斧喻`, a: `（主题词）是打造时代的开山之斧，披荆敢为天下先。` },
      { form: "开头&结尾&分论点模板", q: `一元递进式分论点①：根，扎稳立身之本`, a: `以（主题词）为根，向下沉潜，扎稳立身之本。` },
      { form: "开头&结尾&分论点模板", q: `一元递进式分论点②：干，撑起担当之骨`, a: `以（主题词）为干，向上挺立，撑起担当之骨。` },
      { form: "开头&结尾&分论点模板", q: `一元递进式分论点③：冠，铺开时代之荫`, a: `以（主题词）为冠，向远伸展，铺开时代之荫。` },
      { form: "开头&结尾&分论点模板", q: `一元作文结尾模板：从甲骨文到量子计算机`, a: `从甲骨文的刻痕到量子计算机的代码，贯穿人类前行的，始终是（主题词）带来的力量。它不仅是先人留下的精神财富，更是我们交给未来的承诺书——带着温度，永不褪色。` },
      { form: "开头&结尾&分论点模板", q: `二元作文模板（1）开头：春蚕与蝉鸣意象`, a: `春蚕吐丝成茧前要经历四次蜕皮，蝉鸣响彻盛夏前需蛰伏地下十七年。生命的璀璨从不是偶然。（甲）与（乙），恰似光与影相生、根与叶相济，让平凡孕育出震撼人心的力量。【1句话转述材料】。（甲）与（乙）并非彼此排斥，唯有（甲）（乙）相济，方能于时代洪流中行稳致远。` },
      { form: "开头&结尾&分论点模板", q: `二元作文模板（1）分论点①：甲为根`, a: `（甲）为根，根深方能本固。` },
      { form: "开头&结尾&分论点模板", q: `二元作文模板（1）分论点②：乙为叶`, a: `（乙）为叶，叶茂方能纳新。` },
      { form: "开头&结尾&分论点模板", q: `二元作文模板（1）分论点③：根叶相生`, a: `（甲）（乙）相济，根叶相生，方能于时代洪流中行稳致远。` },
      { form: "开头&结尾&分论点模板", q: `二元作文模板（1）结尾：万千心灯汇聚星河`, a: `（甲）或许微小如萤火，（乙）亦如微光一束；当（甲）与（乙）交相辉映，万千心灯依次点亮，便能汇聚成璀璨星河。这光，既能温暖此刻跋涉的行者，亦将为未来铺就一条缀满希望的朝圣之路。` },
      { form: "开头&结尾&分论点模板", q: `二元作文模板（2）开头：快餐式阅读与信息茧房`, a: `当快餐式阅读冲刷着思维的深度，当算法推送编织着信息的茧房。我们比任何时候都更需要（甲）与（乙）的同频共振。【1句话概述材料】。在今天（甲）和（乙）唯有相辅相成，才能让个人微光汇入时代光芒。` },
      { form: "开头&结尾&分论点模板", q: `二元作文模板（2）分论点①：甲是压舱石`, a: `（甲）是压舱石：沉得住深度，人生才不随浮躁漂移。` },
      { form: "开头&结尾&分论点模板", q: `二元作文模板（2）分论点②：乙是望远镜`, a: `（乙）是望远镜：看得见远方，认知才不困于方寸间。` },
      { form: "开头&结尾&分论点模板", q: `二元作文模板（2）分论点③：同频共振`, a: `（甲）（乙）同频共振：让个体星火汇聚成时代星河。` },
      { form: "开头&结尾&分论点模板", q: `二元作文模板（2）结尾：5G与《诗经》`, a: `当5G信号穿梭在故宫的红墙碧瓦间，当人工智能解码着《诗经》的古老韵律，（甲）与（乙）正共同架起一座连通古今的虹桥，二者相济，方能让传统与现代同频共振。而我们，终将在（甲）与（乙）的交响中，谱写出属于这个时代的华彩乐章。` },
      /* 万能素材句模板 7 条 */
      { form: "万能素材句模板", q: `万能素材句模板：黄旭华`, a: `“中国核潜艇之父”黄旭华投身国防科研事业，怀抱（关键词），踏上报国求索之路。白手攻坚炼就自立风骨，三十载隐姓守义书写家国取舍，以身探海彰显勇者责任，在深蓝碧海书写科研者的时代华章。` },
      { form: "万能素材句模板", q: `万能素材句模板：樊锦诗`, a: `“敦煌的女儿” 樊锦诗抛开世俗浮华，胸怀（关键词），奔赴黄沙漫卷的戈壁。她精研修护恪守匠心，开拓数字保护新路，以严谨务实守护千年文脉，在大漠深处守护跨越千年的文明光华。` },
      { form: "万能素材句模板", q: `万能素材句模板：天问二号科研团队`, a: `深空叩问者，天问二号科研团队，以（关键词）为炬，向茫茫星河追寻未知奥秘。他们聚力携手，共破重重技术难关；接续千年问天情怀，不惧征途漫漫，以集体的实干，绘就中国航天的探索新篇。` },
      { form: "万能素材句模板", q: `万能素材句模板：辛弃疾`, a: `辛弃疾直面世俗偏见，固守（关键词），他既敢于横刀赴义，亦能够理政安民，还以笔墨安放胸中山河。纵然前路布满阻碍，仍将满腔孤忠交付初心，于岁月浮沉中铸就人格的光芒。` },
      { form: "万能素材句模板", q: `万能素材句模板：钟扬`, a: `钟扬跳出安逸的轨道，踏遍雪域高原采集种子，守护大地留存的生机。他深耕科研、培育后学、普及新知，以长久坚守诠释（关键词)，看淡眼前得失荣辱，用生命守护生生不息的希望，于默默耕耘中留下长远回响。` },
      { form: "万能素材句模板", q: `万能素材句模板：陈红军`, a: `陈红军心怀从军报国的理想，践行（关键词）。边关苦寒磨砺意志，戍边时光铸就风骨，生死关头尽显冲锋果敢。重重考验锻造品格，他在雪域边境竖起不朽的英雄丰碑。` },
      { form: "万能素材句模板", q: `万能素材句模板：陈妤颉`, a: `追风少女陈妤颉，以（关键词）作答青春考卷。她在日复一日的训练里锤炼本领，与队友彼此扶持、同心共进；收获成绩时清醒自持，不困于掌声，以奔跑书写少年担当，在赛场之上绽放青春光彩。` },
      /* 论证句模板 6 条 */
      { form: "论证句模板", q: `假设论证·一元①：倘若没有……作为精神的灯塔`, a: `倘若没有（关键词）作为精神的灯塔，（人物名）便容易迷失在尘世的迷雾之中，最终遗失可贵的_______（填入初心、热爱、信仰、风骨、底色等）。` },
      { form: "论证句模板", q: `假设论证·一元②：若是轻易舍弃……`, a: `若是（人物名）轻易舍弃（关键词），那些曾经滚烫的坚守，终将在漫长岁月里，辜负心心念念的_______（填入初心、热爱、信仰、风骨、底色等）。` },
      { form: "论证句模板", q: `假设论证·二元③：假如割裂A与B的联系`, a: `假如割裂 （关键词A）与（关键词B） 的联系，偏执一端、偏废一方，那么（人物名）所有的努力，终会留下难以弥补的缺憾。` },
      { form: "论证句模板", q: `因果论证·一元①：正是因为长存……`, a: `正是因为长存（关键词），（人物名）不肯向平庸俯首，所以方能于漫漫长路中守住______（填入初心、热爱、信仰、风骨、底色等），在风雨颠簸里步履不停。` },
      { form: "论证句模板", q: `因果论证·一元②：唯有以实干浇灌……`, a: `唯有以实干浇灌（关键词），它才不会沦为缥缈空谈，（人物名）日复一日默默耕耘，这份热忱方能托举_____（填入初心、热爱、信仰、风骨、底色等）。` },
      { form: "论证句模板", q: `因果论证·二元③：只有A指引方向，B夯实根基`, a: `只有（关键词A）指引方向，（关键词B） 夯实根基，二者共生相融，（人物名）才能冲破困局，抵达远方。` },
      /* 小结句模板 6 条 */
      { form: "小结句模板", q: `归纳式·一元①：守住灯塔之光`, a: `于漫漫人生行旅，唯有守住【关键词】这束灯塔之光，方能护住心中珍贵的初心。` },
      { form: "小结句模板", q: `归纳式·一元②：美好……依靠实干落地生花`, a: `放眼人的一生，所有美好的【关键词】，都要依靠实干方能落地生花。` },
      { form: "小结句模板", q: `归纳式·二元③：A与B相融共生`, a: `纵观人生征途，偏其一则路难行，唯有【关键词A】与【关键词B】相融共生，方能行稳致远。` },
      { form: "小结句模板", q: `号召式·一元①：奔赴属于自己的山海`, a: `愿人人心怀【关键词】，奔赴属于自己的山海。` },
      { form: "小结句模板", q: `号召式·一元②：以……立身，勇担使命`, a: `青春自有千钧力，我辈更当以【关键词】立身，勇担时代赋予的使命。` },
      { form: "小结句模板", q: `号召式·二元③：平衡A与B`, a: `我辈当懂得平衡【关键词A】与【关键词B】，让二者相辅相成，走好属于自己的征途。` },
      /* v11 新增 / v13 改造：一元作文材料 10 则——题干为材料全文+写作要求，答案为提取的 1 个关键词（参照 2027 关键词提取法） */
      { form: "一元作文材料", q: `材料：\n一位干了四十年的老焊工带徒弟，头三个月不让碰焊枪，只让磨工件。徒弟不解："我是来学焊接的，天天磨铁块有什么用？"师傅说："焊缝好不好，七分在坡口。坡口磨不平，焊得再漂亮也是假把式。"三个月后，徒弟磨出的坡口平整如镜，师傅才开始教他引弧。后来徒弟在省技能大赛中夺魁，焊缝探伤合格率百分之百。\n\n写作要求： 以上材料引发了你对"成才之路"怎样的思考？请写一篇文章，不少于600字。`, a: `关键词：**基础**` },
      { form: "一元作文材料", q: `材料：\n某职业技术学院烹饪专业学生小李，入学时刀工考核全班倒数。他没有急着练雕刻、练摆盘，而是每天切五斤土豆丝，粗细不合格就倒掉重来。一年后，他的"蓑衣黄瓜"能拉开一米不断，被选入国赛集训队。有人问他秘诀，他说："把一样东西切到极致，手就懂了，别的自然也会了。"\n\n写作要求： 根据材料，围绕"极致"与"成长"的关系，自拟题目，写一篇不少于600字的文章。`, a: `关键词：**极致**` },
      { form: "一元作文材料", q: `材料：\n苏州一家只有十二人的小厂，专做古建筑修复用的桐油灰。机器调不出老师傅手工捶打的黏度，他们就坚持人工捶打，一天只出三十公斤。有人劝厂长上设备、扩产量，厂长说："有些东西快不得。故宫修太和殿，用的还是我们的灰。"三十年来，这家厂没亏过，也没大富过，但全国重点文保单位的订单一直没断过。\n\n写作要求： 材料中的"快不得"引发了你怎样的联想？请以"慢与久"为思考方向，写一篇文章。`, a: `关键词：**慢**` },
      { form: "一元作文材料", q: `材料：\n中职毕业的小周在汽车4S店做机电维修。刚入职时，客户看他年轻，要求换老师傅。小周没争辩，默默把车间里报废的变速箱拆了装、装了拆，记了三本笔记。半年后，一辆疑难故障车在三个师傅手里没修好，小周听了听发动机声音，说"三缸失火，大概率是喷油嘴线束虚接"。拆开一看，果然。从此，客户点名找他。\n\n写作要求： 以上材料让你对"底气从哪来"有了什么认识？请写一篇不少于600字的作文。`, a: `关键词：**底气**` },
      { form: "一元作文材料", q: `材料：\n《庄子》里记载了一位"痀偻承蜩"的老人，在竹竿顶上叠丸子，叠到五颗不掉，粘蝉就像捡东西一样容易。别人问他怎么做到的，他说："虽天地之大，万物之多，而唯蜩翼之知。"孔子听后，对弟子说："用志不分，乃凝于神。"\n\n写作要求： 结合材料，联系技能学习或职业成长的经历，谈谈你对"专注"的理解，写一篇文章。`, a: `关键词：**专注**` },
      { form: "一元作文材料", q: `材料：\n数控专业的小陈第一次独立操作加工中心时，把转速调高了百分之十，想"抢一点进度"。师傅发现后，让他停机，把程序参数改回去，然后说了一段话："你省了三分钟，但刀具磨损快了，工件表面粗糙度差了，下一道工序就要多花十分钟去抛光。规矩不是捆你的绳子，是替你省时间的。"\n\n写作要求： 师傅的话引发了你怎样的思考？请围绕"规矩与效率"写一篇文章。`, a: `关键词：**规矩**` },
      { form: "一元作文材料", q: `材料：\n一位文物修复师带学生修复一幅清代刺绣。学生问："怎么判断这一针该用什么线、走什么走向？"修复师说："你先看一万根原针。看够了，手会告诉你。"学生看了三个月，把每一针的方向、力度、用线都描在透明纸上。后来她修复的那片花瓣，连老师傅都看不出接痕。\n\n写作要求： 根据材料，以"看见与做到"为思考范围，写一篇不少于600字的作文。`, a: `关键词：**积累**` },
      { form: "一元作文材料", q: `材料：\n杭州一位修表师傅，专接别人修不好的老表。他的工作台上有一盏灯，照了四十年。有人拿一块进水停走的五十年代梅花表找他，他拆开后发现游丝变形，没有配件，就用镊子一点点把游丝掰回原位，花了整整三天。表走的那天，客户说："这表是我父亲的，你修的不是表，是我们家的一段日子。"师傅说："我修的是表，日子是你自己修回来的。"\n\n写作要求： 材料中"修"与"被修"的关系耐人寻味。请写一篇文章，谈谈你对"修补"的理解。`, a: `关键词：**修补**` },
      { form: "一元作文材料", q: `材料：\n某职校电梯安装与维修专业的学生小赵，毕业前就被三家维保公司争抢。他的"绝活"是蒙眼摸出电梯门锁的十六个触点故障。练成这个本事，是因为他在实训楼里拆装了两百多套门锁，手指上的茧磨了又长。他说："电梯困人时，用户最怕听到'我再查查'。手一摸就知道问题在哪，人家心里就踏实了。"\n\n写作要求： 请结合材料，以"本事"为话题，写一篇不少于600字的作文。`, a: `关键词：**本事**` },
      { form: "一元作文材料", q: `材料：\n宜兴一位紫砂艺人收了个徒弟，前两年只让徒弟练"打泥片"。徒弟不服："我是来学做壶的，光打泥片什么时候能出头？"师傅拿出一把自己二十年前做的壶，指着壶身说："你摸摸，这片泥的厚度，从口到底，差不超过一毫米。你打的泥片，中间厚了半毫米。半毫米，烧出来壶身就是歪的。我让你打的不是泥，是手感。手感到了，壶就自己出来了。"\n\n写作要求： 根据材料，围绕"传承"的内涵，自选角度，写一篇文章。`, a: `关键词：**传承**` },
      /* v12 新增 / v13 改造：二元作文材料 10 则——题干为材料全文+写作要求，答案为提取的 2 个关键词及关系辨析（参照 2027 关键词提取法） */
      { form: "二元作文材料", q: `材料：\n一位做苏绣的绣娘，学了二十年传统针法，作品在省展上屡获好评。后来她发现年轻人更青睐简约风格，便尝试把苏绣的"平针"用在帆布包、手机壳上，甚至和本地文创品牌联名。有人质疑她"丢了传统"，她说："针法没变，变的是用在哪儿。老祖宗的东西要传下去，不能只挂在墙上。"\n\n写作要求： 以上材料引发了你对"传承与创新"怎样的思考？请写一篇文章，不少于600字。`, a: `关键词：**传承**、**创新**（对立统一：守正方能创新，创新为了更好地传承）` },
      { form: "二元作文材料", q: `材料：\n某职校数控专业学生小王，实习时被分配到一家精密模具厂。师傅让他先用手工锉一个六角螺母，公差控制在0.02毫米以内。小王锉了三天，觉得太慢，想上机床。师傅说："你锉过一百个，手知道0.02毫米是什么感觉，将来机床报警你才能判断是刀的问题还是程序的问题。那时候你修起来就快了。"\n\n写作要求： 根据材料，围绕"快与慢"的关系，自拟题目，写一篇不少于600字的作文。`, a: `关键词：**快**、**慢**（对立统一：慢是快的根基，快是慢的结果）` },
      { form: "二元作文材料", q: `材料：\n中职烹饪专业的小张在酒店后厨实习。他发现师傅切文思豆腐时，从来不用尺子量，但切出来的丝粗细均匀。小张问："有什么诀窍？"师傅说："我前三年每天切十块豆腐，规矩刻在手上，现在手就是尺。你以为我自由，其实我比谁都守规矩。"\n\n写作要求： 材料中"自由"与"规矩"的关系耐人寻味。请写一篇文章，谈谈你的理解。`, a: `关键词：**自由**、**规矩**（对立统一：规矩成就真正的自由）` },
      { form: "二元作文材料", q: `材料：\n一家小型汽修厂，老板坚持用原厂配件，价格比副厂件贵三成，客户常因此流失。有伙计建议"明面报原厂，实际装副厂"，利润能翻倍。老板说："修车这行，刹车片差一点，可能就是一条命。我少赚点，晚上睡得着。"三年后，周边几家靠低价抢客的店陆续关门，他的厂却因为事故率为零，被保险公司列为推荐维修点。\n\n写作要求： 结合材料，围绕"利与义"的关系，联系职业生活或社会现实，写一篇文章。`, a: `关键词：**利**、**义**（对立统一：以义取利，义利兼顾）` },
      { form: "二元作文材料", q: `材料：\n一位在康复医院工作的物理治疗师，每天要帮中风患者做重复性的肢体训练。有人问她："天天做一样的事，不枯燥吗？"她说："对我是第一千次，对病人是第一次站起来。我的'独'——一个人的耐心，换的是他们'众'——一家人能重新过日子。"\n\n写作要求： 材料中"独"与"众"的对照引发了你怎样的联想？请写一篇文章。`, a: `关键词：**独**、**众**（对立统一：以一人之“独”，换万家之“众”）` },
      { form: "二元作文材料", q: `材料：\n建筑工地的塔吊司机，每天在几十米高空操作，地面的人只看到塔吊转来转去，很少有人注意驾驶室里的人。一位干了十五年的塔吊师傅说："楼一层层起来，没人记得是谁吊的钢筋。但楼立在那儿，就是我的签名。"\n\n写作要求： 根据材料，以"看见与不被看见"为思考方向，写一篇不少于600字的作文。`, a: `关键词：**看见**、**不被看见**（对立统一：不被看见的付出，撑起被看见的价值）` },
      { form: "二元作文材料", q: `材料：\n一位做了三十年淮扬菜的老师傅，被问到"做了这么多年还有什么难的"时说："最难的是把熟悉的菜当成第一次做。手熟了，心不能熟。心一熟，盐就多一撮，火就老一分。老客一吃就知道，今天师傅走神了。"\n\n写作要求： 材料中"手熟"与"心熟"的辨析引发了你怎样的思考？请写一篇文章。`, a: `关键词：**手熟**、**心熟**（对立统一：手熟是技艺，心熟是态度；手可熟，心不可熟）` },
      { form: "二元作文材料", q: `材料：\n某高职电梯工程技术专业的学生小刘，在校期间考了电梯修理证、电工证、焊接证，还自学了PLC编程。同学笑他"考那么多证有什么用，毕业又不一定都用得上"。毕业那年，一家大型物业公司来校招人，要求"能处理电梯、配电、消防联动故障"，全系只有小刘一个人符合条件。\n\n写作要求： 结合材料，围绕"准备与机会"的关系，写一篇不少于600字的文章。`, a: `关键词：**准备**、**机会**（条件关系：准备是机会的前提，机会偏爱有准备的人）` },
      { form: "二元作文材料", q: `材料：\n一位在社区工作的养老护理员，照顾一位失智老人三年。老人已经认不出家人，却能在她进门时安静下来。有人问她："他都记不住你，你做这些有意义吗？"她说："他记不住我，但我记得他怕冷、怕吵、爱吃软的。我记得，就够了。"\n\n写作要求： 材料中"被记住"与"记住"的不对等关系，引发了你对"付出"怎样的理解？请写一篇文章。`, a: `关键词：**记住**、**被记住**（对立统一：付出不求被记住，却值得被记住）` },
      { form: "二元作文材料", q: `材料：\n宜兴一位紫砂艺人带徒弟，前两年只让打泥片。徒弟问："什么时候教我设计壶型？"师傅说："你打泥片的时候，心里想的是'赶紧打完'，还是想'这片泥的厚薄怎么才能匀'？前者叫干活，后者叫入道。壶型是技，泥片是道。道不稳，技再花也是空的。"\n\n写作要求： 根据材料，围绕"技与道"的关系，自选角度，写一篇文章。`, a: `关键词：**技**、**道**（本末关系：技为末，道为本；道稳则技不空）` }
    ]
  },
  /* v17 修改：应用文写作题干统一改为真题风格（情境描述 + "要求:文中不得透露真实的校名、人名等相关信息，150字左右。"）；文种与范文保持 v16 不变 */
  "应用文写作": {
    /* 求职信/应聘信 10 题（v16：情境 + 完整范文） */
    "求职信/应聘信": [
      { q: `某中职学校计算机应用专业应届毕业生李明，从招聘网站获悉恒达科技有限公司计划招聘网络管理员2名。请你以李明的身份写一封应聘信。\n要求:文中不得透露真实的校名、人名等相关信息，150字左右。`, a: `应聘信\n\n尊敬的恒达科技有限公司领导：\n\n您好！\n\n我是李明，近期从招聘网站获悉贵公司计划招聘网络管理员2名，因此我特来应聘。\n\n在校期间，我系统地学习了计算机网络基础、服务器配置与管理、网络安全等专业课程，各科成绩优良。实习期间，通过自己努力取得了"优秀实习生"称号。\n\n在充满竞争和挑战的今天，我希望为贵单位的发展尽自己的一份微薄之力。热切地盼望贵公司给予答复。\n\n恭祝贵公司事业一帆风顺，祝您工作顺利！\n\n应聘者：李明\n\n2027年6月15日` },

    "活动策划书": [
      { q: `某校学生会拟举办"校园技能节"活动，包含数控车工、文字录入、烹饪摆盘三个比赛项目。请你以校学生会名义写一份活动策划书。\n要求:文中不得透露真实的校名、人名等相关信息，150字左右。`, a: `"校园技能节"活动策划书\n\n一、活动背景与目的\n为丰富校园文化生活，培养学生的团队合作精神和拼搏意识，促进学生全面发展，学校研究决定举办"校园技能节"活动。\n\n二、活动内容\n【活动项目】\n（1）数控车工技能比赛。\n（2）计算机文字录入比赛。\n（3）中式烹饪摆盘比赛。\n【活动流程及时间】\n（1）活动前：11月1日—5日。以班级为单位组织学生报名。\n（2）活动中：\n11月10日：数控车工技能比赛（实训车间）。\n11月12日：计算机文字录入比赛（机房）。\n11月15日：中式烹饪摆盘比赛（烹饪实训室）。\n（3）活动后：11月18日下午4:00。包括颁奖仪式、校长总结发言。\n\n三、其他说明\n比赛期间，部分老师和学生会全体成员负责秩序维护和后勤保障工作。\n【经费预算】\n（1）奖品费用：1500元（奖状、奖杯、奖品）。\n（2）宣传费用：300元（海报、横幅、宣传单）。\n（3）器材费用：500元（比赛器材租赁与维护）。\n（4）其他费用：200元（饮用水、应急药品等）。\n\n××职业技术学校学生会\n2027年10月20日` },
      { q: `某校语文组拟举办"校园读书节"活动，含经典诵读、征文比赛、好书推荐三项内容。请你以校语文组名义写一份活动策划书。\n要求:文中不得透露真实的校名、人名等相关信息，150字左右。`, a: `"校园读书节"活动策划书\n\n一、活动背景与目的\n为丰富校园文化生活，培养学生的团队合作精神和拼搏意识，促进学生全面发展，学校研究决定举办"校园读书节"活动。\n\n二、活动内容\n【活动项目】\n（1）经典诗文诵读比赛。\n（2）"我与好书"征文比赛。\n（3）好书推荐海报展。\n【活动流程及时间】\n（1）活动前：4月1日—5日。以班级为单位组织学生报名。\n（2）活动中：\n4月10日：经典诗文诵读比赛（报告厅）。\n4月15日："我与好书"征文比赛（各班教室）。\n4月20日：好书推荐海报展（图书馆大厅）。\n（3）活动后：4月25日下午4:00。包括颁奖仪式、校长总结发言。\n\n三、其他说明\n比赛期间，部分老师和学生会全体成员负责秩序维护和后勤保障工作。\n【经费预算】\n（1）奖品费用：1500元（奖状、奖杯、奖品）。\n（2）宣传费用：300元（海报、横幅、宣传单）。\n（3）器材费用：500元（音响设备租赁与布置）。\n（4）其他费用：200元（饮用水、应急药品等）。\n\n××职业技术学校语文组\n2027年3月20日` },

      { q: `某校学生会拟举办"环保宣传周"活动，含垃圾分类宣讲、旧物改造展、绿色骑行三项。请你以校学生会名义写一份活动策划书。\n要求:文中不得透露真实的校名、人名等相关信息，150字左右。`, a: `"环保宣传周"活动策划书\n\n一、活动背景与目的\n为丰富校园文化生活，培养学生的团队合作精神和拼搏意识，促进学生全面发展，学校研究决定举办"环保宣传周"活动。\n\n二、活动内容\n【活动项目】\n（1）垃圾分类知识宣讲。\n（2）旧物改造成果展。\n（3）绿色骑行宣传行动。\n【活动流程及时间】\n（1）活动前：6月1日—5日。以班级为单位组织学生报名。\n（2）活动中：\n6月10日：垃圾分类知识宣讲（报告厅）。\n6月11日：旧物改造成果展（教学楼大厅）。\n6月12日：绿色骑行宣传行动（校门口集合）。\n（3）活动后：6月15日下午4:00。包括总结交流、校长总结发言。\n\n三、其他说明\n活动期间，部分老师和学生会全体成员负责秩序维护和后勤保障工作。\n【经费预算】\n（1）奖品费用：1500元（奖状、奖品）。\n（2）宣传费用：300元（海报、横幅、宣传单）。\n（3）器材费用：500元（宣传展板与器材租赁）。\n（4）其他费用：200元（饮用水、应急药品等）。\n\n××职业技术学校学生会\n2027年5月20日` },

    /* 调查报告 10 题（v16：情境 + 完整范文） */
    "调查报告": [
      { q: `某校学生会就"中职生手机使用情况"开展调查，发现多数学生每天使用手机超3小时，也有学生用于学习。请据此写一份调查报告。\n要求:文中不得透露真实的校名、人名等相关信息，150字左右。`, a: `关于中职生手机使用情况的调查报告\n\n一、调查背景与目的\n本次调查是为了了解我校中职生使用手机的时长、用途及影响。通过问卷调查和访谈，收集到有效数据进行分析。\n\n二、调查方法与样本\n本次调查采用调查问卷和访谈相结合的方式，以我校在校中职生为调查对象。共发放问卷1000份，回收有效问卷950份，有效回收率为95%。同时，对部分受访者进行了深入访谈，以获取更详细的信息。\n\n三、调查结果\n调查结果显示，约62%的学生每天使用手机超过3小时。约28%的学生选择将手机主要用于查阅学习资料。\n调查结果还显示出部分学生存在沉迷短视频、影响睡眠的问题。\n\n四、建议\n建议加强手机使用管理，鼓励开展课外阅读与体育锻炼，提供丰富的社团活动，解决沉迷手机问题。\n\n××职业技术学校学生会\n2027年5月10日` },
      { q: `某校对学生"睡眠状况"进行调查，发现近半数学生睡眠不足8小时，主要因作息不规律、使用电子产品。请你写一份调查报告。\n要求:文中不得透露真实的校名、人名等相关信息，150字左右。`, a: `关于学生睡眠状况的调查报告\n\n一、调查背景与目的\n本次调查是为了了解我校学生的睡眠时长、作息习惯及其影响因素。通过问卷调查和访谈，收集到有效数据进行分析。\n\n二、调查方法与样本\n本次调查采用调查问卷和访谈相结合的方式，以我校在校学生为调查对象。共发放问卷1000份，回收有效问卷950份，有效回收率为95%。同时，对部分受访者进行了深入访谈，以获取更详细的信息。\n\n三、调查结果\n调查结果显示，约48%的学生每天睡眠不足8小时。约55%的学生选择睡前使用电子产品。\n调查结果还显示出部分学生存在作息不规律、白天上课注意力不集中的问题。\n\n四、建议\n建议加强作息时间管理，鼓励早睡早起，提供科学的睡眠指导，解决睡眠不足问题。\n\n××职业技术学校学生会\n2027年4月18日` },
      { q: `某校就"学生课外阅读情况"开展调查，发现多数学生每月读书不足1本，阅读以网络小说为主。请你写一份调查报告。\n要求:文中不得透露真实的校名、人名等相关信息，150字左右。`, a: `关于学生课外阅读情况的调查报告\n\n一、调查背景与目的\n本次调查是为了了解我校学生的课外阅读数量、阅读内容及相关习惯。通过问卷调查和访谈，收集到有效数据进行分析。\n\n二、调查方法与样本\n本次调查采用调查问卷和访谈相结合的方式，以我校在校学生为调查对象。共发放问卷1000份，回收有效问卷950份，有效回收率为95%。同时，对部分受访者进行了深入访谈，以获取更详细的信息。\n\n三、调查结果\n调查结果显示，约70%的学生每月阅读课外书不足1本。约45%的学生选择网络小说作为主要阅读内容。\n调查结果还显示出部分学生存在阅读兴趣不浓、阅读时间碎片化的问题。\n\n四、建议\n建议加强阅读氛围营造，鼓励经典名著阅读，提供丰富的图书资源，解决阅读量不足问题。\n\n××职业技术学校语文组\n2027年4月22日` },
      { q: `某校就"学生体育锻炼情况"开展调查，发现部分学生每周锻炼少于2次，课业压力和缺乏场地是主要原因。请你写一份调查报告。\n要求:文中不得透露真实的校名、人名等相关信息，150字左右。`, a: `关于学生体育锻炼情况的调查报告\n\n一、调查背景与目的\n本次调查是为了了解我校学生体育锻炼的频率、方式及影响因素。通过问卷调查和访谈，收集到有效数据进行分析。\n\n二、调查方法与样本\n本次调查采用调查问卷和访谈相结合的方式，以我校在校学生为调查对象。共发放问卷1000份，回收有效问卷950份，有效回收率为95%。同时，对部分受访者进行了深入访谈，以获取更详细的信息。\n\n三、调查结果\n调查结果显示，约40%的学生每周体育锻炼少于2次。约60%的学生选择跑步作为主要锻炼方式。\n调查结果还显示出部分学生存在课业压力大、运动场地不足的问题。\n\n四、建议\n建议加强体育活动时间保障，鼓励每天锻炼一小时，提供完善的运动场地，解决锻炼不足问题。\n\n××职业技术学校体育组\n2027年5月8日` },
      { q: `某校就"学生消费情况"开展调查，发现部分学生月消费偏高，主要用于餐饮和网购，理财意识薄弱。请你写一份调查报告。\n要求:文中不得透露真实的校名、人名等相关信息，150字左右。`, a: `关于学生消费情况的调查报告\n\n一、调查背景与目的\n本次调查是为了了解我校学生的月消费水平、消费结构及理财意识。通过问卷调查和访谈，收集到有效数据进行分析。\n\n二、调查方法与样本\n本次调查采用调查问卷和访谈相结合的方式，以我校在校学生为调查对象。共发放问卷1000份，回收有效问卷950份，有效回收率为95%。同时，对部分受访者进行了深入访谈，以获取更详细的信息。\n\n三、调查结果\n调查结果显示，约35%的学生每月消费超过1200元。约58%的学生选择将支出主要用于餐饮和网购。\n调查结果还显示出部分学生存在冲动消费、缺乏记账习惯的问题。\n\n四、建议\n建议加强理财知识教育，鼓励理性消费，提供记账指导，解决消费无计划问题。\n\n××职业技术学校德育处\n2027年3月28日` },
      { q: `某校就"学生网络安全意识"开展调查，发现部分学生随意连接公共WiFi、泄露个人信息。请你写一份调查报告。\n要求:文中不得透露真实的校名、人名等相关信息，150字左右。`, a: `关于学生网络安全意识的调查报告\n\n一、调查背景与目的\n本次调查是为了了解我校学生的网络安全知识、上网习惯及防范意识。通过问卷调查和访谈，收集到有效数据进行分析。\n\n二、调查方法与样本\n本次调查采用调查问卷和访谈相结合的方式，以我校在校学生为调查对象。共发放问卷1000份，回收有效问卷950份，有效回收率为95%。同时，对部分受访者进行了深入访谈，以获取更详细的信息。\n\n三、调查结果\n调查结果显示，约52%的学生曾随意连接公共WiFi。约30%的学生选择在网络上公开个人信息。\n调查结果还显示出部分学生存在密码设置简单、防范诈骗意识薄弱的问题。\n\n四、建议\n建议加强网络安全教育，鼓励设置复杂密码，提供防诈骗知识讲座，解决安全意识不足问题。\n\n××职业技术学校计算机组\n2027年6月5日` },
      { q: `某校就"学生职业规划意识"开展调查，发现多数学生有初步职业目标，但缺少具体行动方案。请你写一份调查报告。\n要求:文中不得透露真实的校名、人名等相关信息，150字左右。`, a: `关于学生职业规划意识的调查报告\n\n一、调查背景与目的\n本次调查是为了了解我校学生的职业目标、规划意识及行动情况。通过问卷调查和访谈，收集到有效数据进行分析。\n\n二、调查方法与样本\n本次调查采用调查问卷和访谈相结合的方式，以我校在校学生为调查对象。共发放问卷1000份，回收有效问卷950份，有效回收率为95%。同时，对部分受访者进行了深入访谈，以获取更详细的信息。\n\n三、调查结果\n调查结果显示，约65%的学生有初步的职业目标。约25%的学生选择制定了详细的职业规划方案。\n调查结果还显示出部分学生存在目标模糊、缺乏具体行动的问题。\n\n四、建议\n建议加强职业规划指导，鼓励制定阶段目标，提供职业体验机会，解决规划不具体问题。\n\n××职业技术学校招就处\n2027年5月15日` },
      { q: `某校就"学生专业技能学习情况"开展调查，发现多数学生重视实训，但理论学习与实训衔接不足。请你写一份调查报告。\n要求:文中不得透露真实的校名、人名等相关信息，150字左右。`, a: `关于学生专业技能学习情况的调查报告\n\n一、调查背景与目的\n本次调查是为了了解我校学生专业技能学习的态度、方式及效果。通过问卷调查和访谈，收集到有效数据进行分析。\n\n二、调查方法与样本\n本次调查采用调查问卷和访谈相结合的方式，以我校在校学生为调查对象。共发放问卷1000份，回收有效问卷950份，有效回收率为95%。同时，对部分受访者进行了深入访谈，以获取更详细的信息。\n\n三、调查结果\n调查结果显示，约72%的学生重视实训课程的学习。约38%的学生选择能够做到理论与实训相互结合。\n调查结果还显示出部分学生存在重技能轻理论、学习缺乏计划的问题。\n\n四、建议\n建议加强理论与实训衔接，鼓励制定技能训练计划，提供更多的实操机会，解决学用脱节问题。\n\n××职业技术学校教务处\n2027年6月12日` },
      { q: `某校就"校园食堂满意度"开展调查，发现多数学生对菜品口味基本满意，但对价格和排队时间意见较多。请你写一份调查报告。\n要求:文中不得透露真实的校名、人名等相关信息，150字左右。`, a: `关于校园食堂满意度的调查报告\n\n一、调查背景与目的\n本次调查是为了了解我校学生对食堂菜品、价格及服务的满意程度。通过问卷调查和访谈，收集到有效数据进行分析。\n\n二、调查方法与样本\n本次调查采用调查问卷和访谈相结合的方式，以我校在校学生为调查对象。共发放问卷1000份，回收有效问卷950份，有效回收率为95%。同时，对部分受访者进行了深入访谈，以获取更详细的信息。\n\n三、调查结果\n调查结果显示，约68%的学生对菜品口味表示基本满意。约45%的学生选择认为就餐排队时间过长。\n调查结果还显示出部分学生存在对菜价偏高、菜品更新慢的意见。\n\n四、建议\n建议加强食堂管理，鼓励错峰就餐，提供更多平价菜品，解决排队时间长问题。\n\n××职业技术学校后勤处\n2027年4月10日` },
      { q: `某校就"学生顶岗实习情况"开展调查，发现多数学生对口就业，但部分学生反映岗位适应期较长。请你写一份调查报告。\n要求:文中不得透露真实的校名、人名等相关信息，150字左右。`, a: `关于学生顶岗实习情况的调查报告\n\n一、调查背景与目的\n本次调查是为了了解我校学生顶岗实习的岗位匹配度、适应情况及满意度。通过问卷调查和访谈，收集到有效数据进行分析。\n\n二、调查方法与样本\n本次调查采用调查问卷和访谈相结合的方式，以我校顶岗实习学生为调查对象。共发放问卷1000份，回收有效问卷950份，有效回收率为95%。同时，对部分受访者进行了深入访谈，以获取更详细的信息。\n\n三、调查结果\n调查结果显示，约75%的学生实习岗位与所学专业对口。约42%的学生选择表示需要较长时间适应岗位。\n调查结果还显示出部分学生存在沟通不够主动、心理准备不足的问题。\n\n四、建议\n建议加强实习前培训，鼓励主动沟通，提供岗位适应指导，解决适应期较长问题。\n\n××职业技术学校招就处\n2027年7月1日` }

    /* 个人总结 10 题（v16：情境 + 完整范文） */
    "个人总结": [
      { q: `数控专业学生李明本学期成绩优良、待人友好，但存在粗心和自律不足的问题。请你以李明身份写一份个人总结。\n要求:文中不得透露真实的校名、人名等相关信息，150字左右。`, a: `2027年春季学期个人总结\n\n光阴似箭，岁月如梭，流年诠释着成长的含义。这一年有许多收获，也有一些不足之处，现将情况总结如下：\n\n一、个人收获\n思想方面，我认真学习各门专业课程，掌握到许多专业技能，并在期末考试中取得了优异的成绩。\n生活方面，养成了良好的生活习惯。同时待人热情友好，与同学们关系融洽。\n\n二、自己的不足和今后努力的方向\n本学期我收获良多，同时也让我认识到了自己的不足。在学习上，我有时比较粗心大意；在生活上，我对于自己要求不太严格，自律意识较差。接下来我会改掉粗心的问题；同时从日常小事做起，逐步强化自律意识，补齐自身短板。\n\n李明\n2027年7月5日` },
      { q: `计算机专业学生王强本学年在专业学习和社会实践中有收获，也有粗心、自律不足的问题。请你代写一份学年个人总结。\n要求:文中不得透露真实的校名、人名等相关信息，150字左右。`, a: `2026—2027学年个人总结\n\n光阴似箭，岁月如梭，流年诠释着成长的含义。这一年有许多收获，也有一些不足之处，现将情况总结如下：\n\n一、个人收获\n思想方面，我认真学习各门专业课程，掌握到许多专业技能，并在期末考试中取得了优异的成绩。\n生活方面，养成了良好的生活习惯。同时待人热情友好，与同学们关系融洽。\n\n二、自己的不足和今后努力的方向\n本学年我收获良多，同时也让我认识到了自己的不足。在学习上，我有时比较粗心大意；在生活上，我对于自己要求不太严格，自律意识较差。接下来我会改掉粗心的问题；同时从日常小事做起，逐步强化自律意识，补齐自身短板。\n\n王强\n2027年7月10日` },

    "计划": [

      { q: `某学生为准备顶岗实习制定本学期实习准备计划，任务以提升岗位适应能力为主。请你写一份计划。\n要求:文中不得透露真实的校名、人名等相关信息，150字左右。`, a: `2027年春季学期实习准备计划\n\n为了顺利走上实习岗位、提升职业适应能力，现结合自身实际制定本计划。本学期主要任务是巩固专业技能与了解岗位要求，整体情况较上学期有进步。具体措施如下：\n\n1.学期初制定准备清单，明确本学期准备重点。\n2.每周技能训练不少于3次，认真参加实训课程，主动向老师请教岗位要点。\n3.按时完成学习任务，坚持课后练习，积极参加职业指导活动。\n4.严格遵守校纪校规和实训安全规范，不迟到、不早退、不旷课。\n5.每月自查准备进度，期中后及时调整计划。\n\n本人将严格执行本计划，合理安排时间，定期自查调整，遇到困难及时请教，确保各项任务落到实处、取得实效。\n\n郑浩\n2027年3月10日` },
      { q: `某学生为迎接期末考试制定本学期期末复习计划，任务以系统复习为主。请你写一份计划。\n要求:文中不得透露真实的校名、人名等相关信息，150字左右。`, a: `2027年春季学期期末复习计划\n\n为了在期末考试中取得理想成绩、巩固所学知识，现结合自身实际制定本计划。本学期主要任务是系统复习与强化练习，整体情况较上学期有进步。具体措施如下：\n\n1.学期初制定复习清单，明确本学期复习重点。\n2.每周复习练习不少于3次，认真参加复习辅导，主动向老师请教疑难要点。\n3.按时完成复习任务，坚持课后巩固，积极参加学习小组。\n4.严格遵守校纪校规和课堂纪律，不迟到、不早退、不旷课。\n5.每月自查复习进度，期中后及时调整计划。\n\n本人将严格执行本计划，合理安排时间，定期自查调整，遇到困难及时请教，确保各项任务落到实处、取得实效。\n\n吴芳\n2027年3月12日` }
